name: Deploy to Zone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-production-zone
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate deployment configuration
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          ZONE_HOST: ${{ vars.ZONE_HOST }}
          ZONE_PORT: ${{ vars.ZONE_PORT }}
          ZONE_USERNAME: ${{ vars.ZONE_USERNAME }}
          ZONE_TARGET_PATH: ${{ vars.ZONE_TARGET_PATH }}
          ZONE_PM2_APP: ${{ vars.ZONE_PM2_APP }}
          ZONE_SSH_PRIVATE_KEY: ${{ secrets.ZONE_SSH_PRIVATE_KEY }}
          ZONE_HOST_FINGERPRINT: ${{ vars.ZONE_HOST_FINGERPRINT }}
        run: node scripts/validate-deployment.mjs

      - name: Test
        run: npm test

      - name: Prepare production files
        run: npm run deploy:prepare

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZONE_SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.ZONE_SSH_KEY_PASSPHRASE }}
          ZONE_HOST: ${{ vars.ZONE_HOST }}
          ZONE_PORT: ${{ vars.ZONE_PORT }}
          ZONE_HOST_FINGERPRINT: ${{ vars.ZONE_HOST_FINGERPRINT }}
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -T 15 -p "$ZONE_PORT" -t ed25519 "$ZONE_HOST" > ~/.ssh/known_hosts.scan
          node scripts/verify-ssh-host.mjs ~/.ssh/known_hosts.scan ~/.ssh/known_hosts
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/zone_deploy
          chmod 600 ~/.ssh/zone_deploy
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N '' -f ~/.ssh/zone_deploy
          fi
          # Log only the public fingerprint, never the private key.
          ssh-keygen -y -f ~/.ssh/zone_deploy | ssh-keygen -lf -

      - name: Upload application
        env:
          ZONE_HOST: ${{ vars.ZONE_HOST }}
          ZONE_PORT: ${{ vars.ZONE_PORT }}
          ZONE_TARGET_PATH: ${{ vars.ZONE_TARGET_PATH }}
          ZONE_USERNAME: ${{ vars.ZONE_USERNAME }}
        run: |
          ssh -v -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/zone_deploy -p "$ZONE_PORT" "$ZONE_USERNAME@$ZONE_HOST" "mkdir -p '$ZONE_TARGET_PATH'"
          rsync -az --checksum -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/zone_deploy -p $ZONE_PORT" .deploy/ "$ZONE_USERNAME@$ZONE_HOST:$ZONE_TARGET_PATH/"

      - name: Restart application
        env:
          ZONE_HOST: ${{ vars.ZONE_HOST }}
          ZONE_PM2_APP: ${{ vars.ZONE_PM2_APP }}
          ZONE_PORT: ${{ vars.ZONE_PORT }}
          ZONE_USERNAME: ${{ vars.ZONE_USERNAME }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/zone_deploy -p "$ZONE_PORT" "$ZONE_USERNAME@$ZONE_HOST" "pm2 restart '$ZONE_PM2_APP' --update-env"

      - name: Verify public routes
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$PRODUCTION_URL/" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/chemistry/" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/chemistry/lab3d/lab3d.html" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/chemistry/lab3d/sample_transfer.mjs" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/chemistry/lab3d/course_lab_models.mjs" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/hub-assets/lab-chemistry.jpg" >/dev/null && \
               curl --fail --silent --show-error "$PRODUCTION_URL/hub-assets/chemistry-motion.webm" >/dev/null; then
              echo "Production routes are healthy."
              exit 0
            fi
            echo "Waiting for PM2 and mod_proxy (attempt $attempt of 12)..."
            sleep 5
          done
          echo "Production verification failed."
          exit 1
