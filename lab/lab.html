<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E7ECEA">
<title>Bench Chemistry Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: bench workspace — task card | glassware bench | reagent shelf, notebook under the bench. Tile-grey lab neutrals, fume-hood teal accent, amber for warnings. */
:root {
  --bg: #E7ECEA; --surface: #FAFBFA; --sunk: #DCE3E0; --ink: #15201D; --muted: #55645E; --line: #C3CEC9;
  --accent: #0B6B63; --accent-ink: #FFFFFF; --accent-soft: #D3E8E4; --amber: #B5620C; --ok: #2C7A48; --ok-soft: #DCEFE2; --err: #B3261E; --err-soft: #F8E0DD;
  --glass: rgba(205,228,236,.35); --glass-line: #7D958F;
  --f-display: 'Unbounded', 'Segoe UI', system-ui, sans-serif; --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1513; --surface: #151E1B; --sunk: #1D2824; --ink: #DDE8E3; --muted: #93A59E; --line: #2D3B36;
  --accent: #4CBBAC; --accent-ink: #062320; --accent-soft: #173A35; --amber: #E59B48; --ok: #63C485; --ok-soft: #173525; --err: #F07A70; --err-soft: #3D1C1A;
  --glass: rgba(120,160,175,.14); --glass-line: #9DB5AE; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #151E1B; --sunk: #1D2824; --ink: #DDE8E3; --muted: #93A59E; --line: #2D3B36;
  --accent: #4CBBAC; --accent-ink: #062320; --accent-soft: #173A35; --amber: #E59B48; --ok: #63C485; --ok-soft: #173525; --err: #F07A70; --err-soft: #3D1C1A;
  --glass: rgba(120,160,175,.14); --glass-line: #9DB5AE; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
body.lab-active { min-height: 100dvh; overscroll-behavior: none; }
body.lab-active #app { max-width: none; min-height: calc(100dvh - 54px); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num, .lcd { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }

.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; color: var(--accent); }
.brand b { font: 700 15px/1.1 var(--f-display); letter-spacing: .01em; display: block; }
.brand small { color: var(--muted); font-size: 12px; }
.top .sp { flex: 1; }
.rolechip { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
#lang { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; }

#app { padding: 18px 16px 40px; max-width: 1360px; margin: 0 auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--err); color: #fff; border-color: var(--err); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.chip.lvl { background: var(--accent-soft); color: var(--accent); }
.topicname { font-size: 12.5px; color: var(--muted); }
.notice { background: var(--accent-soft); border-radius: var(--r); padding: 10px 14px; max-width: 72ch; }
.notice.err { background: var(--err-soft); color: var(--err); font-weight: 600; }
.empty { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.panel h3 { font-size: 15px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: min(92vw, 560px); transition: .25s; pointer-events: none; z-index: 50; font-weight: 500; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--err); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }

/* home */
.home { display: grid; gap: 18px; }
.intro { display: flex; gap: 24px; justify-content: space-between; align-items: end; flex-wrap: wrap; padding-bottom: 6px; }
.intro h1 { font: 700 clamp(22px, 3.2vw, 32px)/1.15 var(--f-display); letter-spacing: -.01em; }
.lede { color: var(--muted); max-width: 62ch; margin: 6px 0 0; }
.namefield { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: min(100%, 280px); }
.namefield input, .panel input, .panel textarea, .assign input { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--surface); width: 100%; }
.sect { font: 600 13px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-top: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.sccard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.sccard h3 { font-size: 17px; }
.scmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.scgoal { margin: 0; color: var(--muted); font-size: 14px; }
.anote { font-size: 13px; color: var(--amber); font-weight: 500; margin: 0; }
.status { margin: 0; font-size: 13px; color: var(--muted); } .status.ok { color: var(--ok); font-weight: 600; }
.mx-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.matrix { display: grid; grid-template-columns: minmax(150px, .8fr) repeat(3, minmax(190px, 1fr)); min-width: 760px; }
.matrix > div { padding: 12px; border-bottom: 1px solid var(--line); }
.mx-h { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); }
.mx-topic { display: grid; gap: 2px; align-content: start; border-right: 1px solid var(--line); }
.mx-topic strong { font-size: 14.5px; } .mx-topic span { font-size: 12.5px; color: var(--muted); }
.mx-topic { box-shadow: inset 4px 0 0 var(--tc); }
.t-ind { --tc: #C2410C; } .t-neu { --tc: #2563A8; } .t-pre { --tc: #6B4FA0; } .t-org { --tc: #3E7D3A; }
.mx-cell { display: grid; gap: 6px; align-content: start; position: relative; }
.mx-cell strong { font-size: 14px; } .mx-cell p { margin: 0; font-size: 13px; color: var(--muted); }
.mx-cell .btn { justify-self: start; }
.mx-lvl { display: none; font-size: 11px; color: var(--muted); }
.tick { position: absolute; top: 10px; right: 12px; color: var(--ok); font-weight: 700; }
@media (max-width: 760px) {
  .matrix { grid-template-columns: 1fr; min-width: 0; }
  .mx-h { display: none; } .mx-lvl { display: block; }
  .mx-topic { border-right: 0; background: var(--sunk); }
}
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.assign, .results { display: grid; gap: 14px; }
.newassign { border-color: var(--accent); }
.newassign em { font-style: normal; color: var(--accent); }
.alist { display: grid; gap: 8px; }
.arow { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.arow.off { opacity: .6; }
.arow .row { grid-column: 1 / -1; }
.ainfo { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; }
.astats { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.resbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.resbar select { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); max-width: 100%; }
.kpis { display: flex; gap: 10px; flex-wrap: wrap; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; min-width: 130px; }
.kpi span { font-size: 12px; color: var(--muted); } .kpi strong { font-size: 20px; font-family: var(--f-mono); font-weight: 500; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.rtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.rtable th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 9px 12px; background: var(--sunk); white-space: nowrap; }
.rtable td { padding: 9px 12px; border-top: 1px solid var(--line); }
.rtable td.num { text-align: right; white-space: nowrap; }
.rrow { cursor: pointer; } .rrow:hover { background: var(--sunk); }
.rrow td:first-child { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.acct { font-size: 12px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.wip { background: var(--sunk); color: var(--muted); }
.mcount { color: var(--err); font-weight: 600; }
.detail td { background: var(--sunk); }
.mlist { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
.mt { font-family: var(--f-mono); color: var(--muted); margin-right: 8px; font-size: 12px; }

/* lab */
.labbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.labtitle { display: flex; gap: 8px; align-items: center; flex: 1 1 160px; min-width: 0; flex-wrap: wrap; }
.counters { display: flex; gap: 6px; }
.counter { display: grid; justify-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; min-width: 64px; }
.counter strong { font: 500 17px/1.2 var(--f-mono); } .counter span { font-size: 11px; color: var(--muted); }
.counter.warn strong { color: var(--err); }
.labgrid { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 14px; align-items: start; }
.draghint { margin: 0; font-size: 13.5px; color: var(--muted); }
.scenewrap { padding: 0; overflow: hidden; touch-action: none; overscroll-behavior: contain; -webkit-user-select: none; user-select: none; }
.scenewrap .fxc { border-radius: var(--r); }
.scene.drag { cursor: default; width: 100%; touch-action: none; overscroll-behavior: contain; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.lab.k-distill .labgrid, .lab.k-combust .labgrid, .lab.k-analysis .labgrid { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); }
@media (max-width: 1080px) { .labgrid, .lab .labgrid { grid-template-columns: minmax(0, 1fr) !important; } }
@media (max-width: 760px) {
  .labgrid, .lab .labgrid { display: flex; flex-direction: column; align-items: stretch; }
  .benchcol { display: contents; }
  .task { order: 0; } .goggles { order: 1; } .bench { order: 2; } .shelf { order: 3; } .notebook { order: 4; }
  .labtitle .topicname, .brand small { display: none; }
  body.lab-active .top { position: sticky; padding: max(7px, env(safe-area-inset-top, 0px)) 8px 7px; gap: 7px; }
  body.lab-active .brand svg { width: 25px; height: 25px; }
  body.lab-active .rolechip { display: none; }
  body.lab-active #app { width: 100%; padding: 8px 0 max(18px, env(safe-area-inset-bottom, 0px)); }
  body.lab-active .labbar, body.lab-active .task, body.lab-active .draghint, body.lab-active .goggles, body.lab-active .notebook { margin-left: 8px; margin-right: 8px; }
  body.lab-active .labbar { margin-bottom: 8px; gap: 7px; }
  body.lab-active .scenewrap { width: 100%; border-left: 0; border-right: 0; border-radius: 0; }
  body.lab-active .scenewrap .fxc { display: block; width: 100% !important; max-width: none !important; border-radius: 0; }
}
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.task h1 { font: 700 19px/1.25 var(--f-display); }
.goal { margin: 0; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.hint { background: color-mix(in srgb, var(--amber) 14%, transparent); border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.hint strong { color: var(--amber); }
.answer { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.answer h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.answer p { margin: 0; font-size: 13.5px; }
.fields { display: grid; gap: 8px; }
.fields.inline { grid-template-columns: repeat(3, 1fr); }
.field { display: grid; gap: 3px; }
.field label { font-size: 13.5px; font-weight: 500; }
.field select, .field input { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); width: 100%; }
.field.bad select, .field.bad input, .field.bad .checks { border-color: var(--err); box-shadow: 0 0 0 2px var(--err-soft); }
.field.bad label { color: var(--err); }
.unit { color: var(--muted); font-weight: 400; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 12px; border: 1px solid transparent; border-radius: 7px; padding: 2px; }
.cbx { display: flex; gap: 5px; align-items: center; font-family: var(--f-mono); font-size: 14px; }
.whylist { margin: 0; padding-left: 18px; color: var(--err); font-size: 13.5px; }
.success { background: var(--ok-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.success strong { color: var(--ok); font: 700 16px/1.2 var(--f-display); } .success p { margin: 0; }
.report textarea { font: 12px/1.4 var(--f-mono); word-break: break-all; }
.curvebox { display: grid; gap: 4px; } .curvebox canvas { width: 100%; max-width: 100%; height: auto; background: var(--sunk); border-radius: 8px; }
.cap { font-size: 12px; color: var(--muted); }

.benchcol { display: grid; gap: 12px; min-width: 0; }
.goggles { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--amber); color: var(--amber); background: transparent; border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 600; justify-self: start; }
.goggles.on { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.gogsvg { width: 44px; height: 22px; display: block; }
.bench { background: linear-gradient(var(--surface), var(--surface)) padding-box; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.vessels { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; padding: 10px 6px 0; border-bottom: 6px solid var(--sunk); }
.vessel { border: 1px solid transparent; background: none; border-radius: 10px; padding: 4px 4px 8px; display: grid; justify-items: center; gap: 2px; cursor: pointer; min-width: 56px; }
.vessel:hover { background: var(--sunk); }
.vessel.sel { border-color: var(--accent); background: var(--accent-soft); }
.vwrap { display: block; }
.fxc { display: block; max-width: 100%; height: auto; }
.bottle .liq { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 4px; border-radius: 2px; opacity: .9; }
.bottle { padding-bottom: 14px; }
.appar .fxc, .combrow .fxc, .train .fxc { margin: 0 auto; }
.vessel.k-tube .vwrap, .limebox .vwrap { width: 38px; height: 128px; } .vessel.k-beaker .vwrap { width: 120px; height: 130px; } .vessel.k-flask .vwrap { width: 120px; height: 140px; }
.vwrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.glass { fill: var(--glass); } .glass-line { fill: none; stroke: var(--glass-line); stroke-width: 1.8; } .grad { stroke: var(--glass-line); stroke-width: 1; opacity: .7; }
.vlabel { font-size: 12.5px; font-weight: 600; } .vvol { font: 12px var(--f-mono); color: var(--muted); }
.meter { font: 500 12px var(--f-mono); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 1px 6px; }
.bub { animation: rise 1.6s ease-in infinite; }
@keyframes rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-60px); opacity: 0; } }
.benchtop { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; }
.zoom { margin: 0; display: grid; justify-items: center; gap: 4px; background: radial-gradient(circle at 50% 40%, var(--surface), var(--sunk)); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 8px; }
.zoom figcaption { font-size: 12px; color: var(--muted); }
@media (max-width: 900px) { .benchtop { grid-template-columns: minmax(0, 1fr); } .zoom { order: -1; } }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tlabel { font-size: 13px; font-weight: 600; margin-right: 4px; }
.burette { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.burette strong { font-size: 18px; } .burette .bar { flex: 1; max-width: 220px; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.burette .bar span { display: block; height: 100%; background: var(--accent); }
.reading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--sunk); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
.strip { width: 18px; height: 34px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.phchart { display: flex; gap: 2px; flex-wrap: wrap; }
.phchart span { width: 24px; height: 22px; font: 11px/22px var(--f-mono); text-align: center; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,.6); border-radius: 2px; }
.lcd { background: #1B2B23; color: #9FF0B8; padding: 3px 10px; border-radius: 5px; font-size: 20px; }
.shelf { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.shelf h2, .notebook h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.amounts { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.amounts > span, .seg > span { margin-right: 4px; color: var(--muted); }
.amt { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 12.5px var(--f-mono); }
.amt.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bottles { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.bottle { position: relative; border: 1px solid var(--line); border-radius: 8px 8px 10px 10px; background: var(--surface); padding: 14px 6px 8px; cursor: pointer; display: grid; gap: 2px; text-align: center; min-width: 0; }
.bottle:hover { border-color: var(--accent); transform: translateY(-1px); }
.bottle .cap { position: absolute; top: -1px; left: 50%; transform: translateX(-50%); width: 40%; height: 7px; border-radius: 0 0 4px 4px; background: var(--bc, var(--muted)); }
.bottle .bf { font: 500 14px/1.2 var(--f-mono); overflow-wrap: anywhere; hyphens: manual; }
.bottle .bn { font-size: 11px; color: var(--muted); line-height: 1.25; }
.bottle .tag { font-size: 10.5px; color: var(--accent); font-weight: 600; }
.bottle.k-acid { --bc: #D2453B; } .bottle.k-base { --bc: #2F6DC0; } .bottle.k-salt { --bc: #8A9893; } .bottle.k-ind { --bc: #8C3FA8; } .bottle.k-water { --bc: #59A6C9; } .bottle.k-unk { --bc: var(--amber); }

<script>
/* ===================== CHEMISTRY ENGINE ===================== */
const KW = 1e-14, KA_NH4 = 5.6e-10, KA_AC = 1.75e-5, K1 = 4.45e-7, K2 = 4.69e-11, CO2_SOL = 0.035;
const METALS = {
  Ag: { z: 1, koh: 2e-8, oh: 'Ag2O' },
  Ba: { z: 2, kco: 2.6e-9, co: 'BaCO3' },
  Ca: { z: 2, koh: 5.5e-6, oh: 'CaOH2', kco: 3.4e-9, co: 'CaCO3' },
  Cu: { z: 2, koh: 2.2e-20, oh: 'CuOH2', kco: 1.4e-10, co: 'CuCO3' },
  Fe2: { z: 2, koh: 8e-16, oh: 'FeOH2', kco: 3.1e-11, co: 'FeCO3' },
  Fe3: { z: 3, koh: 1e-36, oh: 'FeOH3' },
  Pb: { z: 2, koh: 1.2e-15, oh: 'PbOH2', kco: 7.4e-14, co: 'PbCO3' },
};
// [name, metal, anion, anion-per-formula, Ksp]
const SALTS = [
  ['AgI', 'Ag', 'I', 1, 8.5e-17], ['AgCl', 'Ag', 'Cl', 1, 1.8e-10], ['PbI2', 'Pb', 'I', 2, 7e-9],
  ['BaSO4', 'Ba', 'SO4', 1, 1.1e-10], ['PbSO4', 'Pb', 'SO4', 1, 1.6e-8], ['PbCl2', 'Pb', 'Cl', 2, 1.7e-5],
];
// precipitate appearance: colour key + swatch
const PPT = {
  AgCl: ['white', '#F4F4F0'], AgI: ['paleyellow', '#EFE3A0'], PbI2: ['brightyellow', '#F2C81C'],
  BaSO4: ['white', '#F7F7F4'], PbSO4: ['white', '#F2F2EE'], PbCl2: ['white', '#EDEDE8'],
  Ag2O: ['brownblack', '#4A3426'], CaOH2: ['white', '#F0F0EC'], CuOH2: ['blue', '#3D7FD1'],
  FeOH2: ['dirtygreen', '#7F9A62'], FeOH3: ['rustbrown', '#A0521C'], PbOH2: ['white', '#EFEFEA'],
  BaCO3: ['white', '#F6F6F2'], CaCO3: ['white', '#F7F7F3'], CuCO3: ['bluegreen', '#4FA39A'],
  FeCO3: ['greywhite', '#C9CCC0'], PbCO3: ['white', '#F3F3EF'],
};

function pptSalt(a, b, mx, V, K) {
  // a mmol metal, b mmol anion, 1:mx stoichiometry, V mL, Ksp in M units
  const g = x => ((a - x) / V) * Math.pow((b - mx * x) / V, mx) - K;
  if (g(0) <= 0) return 0;
  let lo = 0, hi = Math.min(a, b / mx);
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (g(m) > 0) lo = m; else hi = m; }
  return lo;
}

function speciate(tot, V) {
  const t = Object.assign({}, tot);
  const ppt = {};
  for (const [name, M, X, mx, K] of SALTS) {
    if ((t[M] || 0) > 1e-12 && (t[X] || 0) > 1e-12) {
      const x = pptSalt(t[M], t[X], mx, V, K);
      if (x > 1e-12) { ppt[name] = (ppt[name] || 0) + x; t[M] -= x; t[X] -= mx * x; }
    }
  }
  const c = k => Math.max(0, t[k] || 0) / V;
  const evalAt = (pH, detail) => {
    const H = Math.pow(10, -pH), OH = KW / H;
    const D = H * H + K1 * H + K1 * K2, a1 = K1 * H / D, a2 = K1 * K2 / D;
    let Cf = c('Ct');
    let cat = c('Na') + c('K') + H + c('NH3') * H / (H + KA_NH4);
    const p = {}, dis = {};
    for (const m in METALS) {
      const cM = c(m); if (!cM) continue;
      const me = METALS[m];
      const cap = me.koh ? me.koh / Math.pow(OH, me.z) : Infinity;
      let pc = 0;
      if (me.kco && Cf > 0 && a2 > 0) {
        const kk = me.kco / a2;
        if (cM * Cf > kk) { const s = cM + Cf; pc = (s - Math.sqrt(Math.max(0, s * s - 4 * (cM * Cf - kk)))) / 2; }
      }
      const dC = cM - pc;
      let d;
      if (pc > 0 && dC < cap) { d = dC; Cf -= pc; p[me.co] = pc; }
      else { d = Math.min(cM, cap); if (cM - d > 0) p[me.oh] = cM - d; }
      dis[m] = d; cat += me.z * d;
    }
    const an = c('Cl') + c('NO3') + 2 * c('SO4') + c('I') + c('Ac') * KA_AC / (H + KA_AC) + Cf * (a1 + 2 * a2) + OH;
    if (!detail) return cat - an;
    return { f: cat - an, H, OH, p, dis, h2co3: Cf * H * H / D, nh3free: c('NH3') * KA_NH4 / (H + KA_NH4) };
  };
  let lo = -1.5, hi = 15.5;
  for (let i = 0; i < 70; i++) { const m = (lo + hi) / 2; if (evalAt(m) > 0) lo = m; else hi = m; }
  const pH = (lo + hi) / 2;
  const d = evalAt(pH, true);
  for (const k in d.p) ppt[k] = (ppt[k] || 0) + d.p[k] * V;
  return { pH, ppt, dis: d.dis, h2co3: d.h2co3, nh3free: d.nh3free };
}

/* A vessel: { V (mL), tot{mmol}, ind{name: drops} } */
function equilibrate(v) {
  let gas = 0;
  if (v.V <= 1e-6) { v.eq = { pH: 7, ppt: {}, dis: {}, dry: true }; return 0; }
  for (let i = 0; i < 4; i++) {
    const e = speciate(v.tot, v.V);
    v.eq = e;
    if (e.h2co3 > CO2_SOL + 1e-4) {
      const esc = (e.h2co3 - CO2_SOL) * v.V;
      v.tot.Ct = Math.max(0, (v.tot.Ct || 0) - esc); gas += esc;
    } else break;
  }
  return gas;
}

/* ---------- colours ---------- */
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lerpC(a, b, t) { return a.map((x, i) => Math.round(x + (b[i] - x) * Math.max(0, Math.min(1, t)))); }
function ramp(stops, x) {
  if (x <= stops[0][0]) return hex2rgb(stops[0][1]);
  for (let i = 1; i < stops.length; i++) if (x <= stops[i][0]) {
    const [x0, c0] = stops[i - 1], [x1, c1] = stops[i];
    return lerpC(hex2rgb(c0), hex2rgb(c1), (x - x0) / (x1 - x0));
  }
  return hex2rgb(stops[stops.length - 1][1]);
}
/* Seven recognisable universal-indicator families.  Interpolation between the
   anchors is continuous, so even a small real pH change begins changing the
   rendered liquid instead of jumping between arbitrary colour bands. */
const UNIV = [[1, '#D7263D'], [3.5, '#F06428'], [5.5, '#F2C230'], [7, '#42A84B'], [9, '#287FBE'], [11, '#3F51A3'], [13.5, '#762E91']];
// indicator -> {rgb, alpha, key(colour word)}
function indColor(ind, pH) {
  switch (ind) {
    case 'univ': {
      const rgb = ramp(UNIV, pH);
      const key = pH < 2.25 ? 'red' : pH < 4.5 ? 'orange' : pH < 6.25 ? 'yellow' : pH < 8 ? 'green' : pH < 10 ? 'blue' : pH < 12.25 ? 'indigo' : 'violet';
      return { rgb, a: .85, key };
    }
    case 'litmus': {
      const rgb = ramp([[4.5, '#C0392B'], [6.5, '#8E3B8E'], [8.3, '#2E5FA8']], pH);
      return { rgb, a: .8, key: pH < 5 ? 'red' : pH < 8 ? 'purple' : 'blue' };
    }
    case 'phph': {
      const a = pH < 8.2 ? 0 : Math.min(.9, (pH - 8.2) / 1.6 * .9);
      return { rgb: hex2rgb(pH > 9.6 ? '#C2186B' : '#E8509E'), a, key: a < .05 ? 'colourless' : pH < 9 ? 'palepink' : 'crimson' };
    }
    case 'mo': {
      const rgb = ramp([[3.1, '#D6303A'], [3.8, '#EE7A2A'], [4.4, '#F2C230']], pH);
      return { rgb, a: .8, key: pH < 3.2 ? 'red' : pH < 4.3 ? 'orange' : 'yellow' };
    }
  }
}
function vesselLook(v) {
  // returns {liquid: css rgba, cloud: css or null, ppt list, colourKey}
  const e = v.eq || { pH: 7, ppt: {}, dis: {} };
  let rgb = [190, 220, 235], a = .28;
  const conc = (m) => (e.dis && e.dis[m]) || 0;
  const mix = (c2, w) => { rgb = lerpC(rgb, c2, w); a = Math.max(a, .28 + w * .5); };
  let baseKey = 'colourless';
  if (conc('Cu') > .004) { mix([60, 140, 225], Math.min(.85, conc('Cu') * 9)); baseKey = 'lightblue'; }
  if (conc('Fe3') > .004) { mix([205, 140, 40], Math.min(.85, conc('Fe3') * 9)); baseKey = 'yellowbrown'; }
  if (conc('Fe2') > .004) { mix([160, 205, 130], Math.min(.6, conc('Fe2') * 6)); baseKey = 'palegreen'; }
  let indKey = null;
  const inds = Object.keys(v.ind || {}).filter(k => v.ind[k] > 0);
  for (const k of inds) {
    const ic = indColor(k, e.pH);
    // Hue follows the indicator's own transition range and the calculated pH;
    // saturation follows indicator concentration, so dilution makes the colour
    // paler instead of leaving a permanently opaque dye in the vessel.
    const strength = Math.min(1, v.ind[k] * 20 / Math.max(1, v.V));
    const w = ic.a * Math.min(1, .12 + strength * .92);
    if (w > .02) { rgb = lerpC(rgb, ic.rgb, w); a = Math.max(a, .3 + w * .6); }
    indKey = ic.key;
  }
  // suspended precipitate makes it cloudy
  let cloud = null, total = 0, main = null;
  for (const k in e.ppt) if (e.ppt[k] > 0.0015) { total += e.ppt[k]; if (!main || e.ppt[k] > e.ppt[main]) main = k; }
  if (main) cloud = PPT[main][1];
  return { rgb, a: Math.min(.92, a), cloud, pptMain: main, pptTotal: total, baseKey, indKey, inds };
}

/* ---------- ethanol–water VLE (1 atm) ---------- */
const VLE = [
  [0, 0, 100], [0.019, 0.17, 95.5], [0.0721, 0.3891, 89.0], [0.0966, 0.4375, 86.7], [0.1238, 0.4704, 85.3],
  [0.1661, 0.5089, 84.1], [0.2337, 0.5445, 82.7], [0.2608, 0.558, 82.3], [0.3273, 0.5826, 81.5], [0.3965, 0.6122, 80.7],
  [0.5079, 0.6564, 79.8], [0.5732, 0.6841, 79.3], [0.6763, 0.7385, 78.74], [0.7472, 0.7815, 78.41], [0.8943, 0.8943, 78.15], [1, 1, 78.3]];
function vle(x, col) {
  x = Math.max(0, Math.min(1, x));
  for (let i = 1; i < VLE.length; i++) if (x <= VLE[i][0]) {
    const [x0, y0, T0] = VLE[i - 1], [x1, y1, T1] = VLE[i], f = (x - x0) / (x1 - x0);
    return [y0 + (y1 - y0) * f, T0 + (T1 - T0) * f];
  }
  return [1, 78.3];
}
const ML_E = 58.4, ML_W = 18.07;
function mixVol(nE, nW) { return nE * ML_E + nW * ML_W; }
function volPct(nE, nW) { const v = mixVol(nE, nW); return v > 0 ? nE * ML_E / v * 100 : 0; }

if (typeof module !== 'undefined') module.exports = { speciate, equilibrate, vesselLook, indColor, vle, volPct, mixVol };
/* ===================== 2.5D CANVAS RENDERING ===================== */
const RM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const FXR = { list: [], last: 0, tok: null, tokAt: 0 };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function tok() {
  const now = performance.now();
  if (!FXR.tok || now - FXR.tokAt > 1000) {
    const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue(n).trim();
    const surf = g('--surface') || '#ffffff'; let dark = false;
    if (surf[0] === '#') { const n = parseInt(surf.slice(1), 16); dark = (((n >> 16) & 255) + ((n >> 8) & 255) + (n & 255)) / 3 < 100; }
    FXR.tok = { ink: g('--ink'), muted: g('--muted'), line: g('--line'), glass: g('--glass-line') || '#7D958F', surface: surf, sunk: g('--sunk'), accent: g('--accent'), dark };
    FXR.tokAt = now;
  }
  return FXR.tok;
}
function fxCanvas(w, h, draw, cls) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const el = document.createElement('canvas');
  el.width = Math.round(w * dpr); el.height = Math.round(h * dpr);
  el.className = 'fxc ' + (cls || ''); el.style.aspectRatio = w + ' / ' + h; el.setAttribute('aria-hidden', 'true');
  FXR.list.push({ el, w, h, draw, dpr });
  return el;
}
function fxLoop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - (FXR.last || now)) / 1000)); FXR.last = now;
  if (!document.hidden) {
    try { simTick(dt); } catch (e) { console.error(e); }
    for (const c of FXR.list) {
      if (!c.el.isConnected) continue;
      const r = c.el.getBoundingClientRect(); if (r.bottom < -40 || r.top > innerHeight + 40 || !r.width) continue;
      const ctx = c.el.getContext('2d'); ctx.setTransform(c.dpr, 0, 0, c.dpr, 0, 0); ctx.clearRect(0, 0, c.w, c.h);
      try { c.draw(ctx, c.w, c.h, dt, now / 1000); } catch (e) { console.error(e); }
    }
  }
  requestAnimationFrame(fxLoop);
}

/* ---------- vessel geometry (y grows downward) ---------- */
const GEO = {};
function geo(kind, ox, oy) {
  const key = kind + ':' + ox + ':' + oy; if (GEO[key]) return GEO[key];
  let g;
  if (kind === 'tube') { const cx = ox + 22, top = oy, bot = oy + 168, r = 14; g = { kind, cx, top, bot, r, hw: y => y < bot - r ? r : Math.sqrt(Math.max(0, r * r - (y - (bot - r)) ** 2)), ell: .34, settleK: 140 }; }
  else if (kind === 'beaker') { const cx = ox + 70, top = oy, bot = oy + 132, r = 56, c = 9; g = { kind, cx, top, bot, r, hw: y => y < bot - c ? r : r - c + Math.sqrt(Math.max(0, c * c - (y - (bot - c)) ** 2)), ell: .2, settleK: 28 }; }
  else { const cx = ox + 70, top = oy, nb = oy + 50, bot = oy + 160, rn = 12, rb = 62, c = 10; g = { kind, cx, top, bot, r: rb, nb, hw: y => { if (y < nb) return rn; if (y > bot - c) return rb - c + Math.sqrt(Math.max(0, c * c - (y - (bot - c)) ** 2)); return rn + (rb - rn) * Math.pow(Math.min(1, (y - nb) / (bot - c - nb)), 1.08); }, ell: .24, settleK: 20 }; }
  const N = 140, ys = [], cum = [0]; let acc = 0;
  for (let i = 0; i <= N; i++) ys.push(g.bot - (g.bot - g.top) * i / N);
  for (let i = 1; i <= N; i++) { const y = (ys[i] + ys[i - 1]) / 2; acc += g.hw(y) ** 2; cum.push(acc); }
  g.levelY = f => { if (f <= 0) return g.bot; const tgt = Math.min(1, f) * acc; for (let i = 1; i <= N; i++) if (cum[i] >= tgt) { const fr = (tgt - cum[i - 1]) / Math.max(1e-9, cum[i] - cum[i - 1]); return ys[i - 1] + (ys[i] - ys[i - 1]) * fr; } return g.top; };
  g.path = (ctx, inset) => {
    inset = inset || 0; const S = 70; ctx.beginPath();
    for (let i = 0; i <= S; i++) { const y = g.top + (g.bot - g.top) * i / S; const x = g.cx - Math.max(0, g.hw(y) - inset); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    for (let i = S; i >= 0; i--) { const y = g.top + (g.bot - g.top) * i / S; ctx.lineTo(g.cx + Math.max(0, g.hw(y) - inset), y); }
    ctx.closePath();
  };
  return (GEO[key] = g);
}

/* ---------- per-vessel visual state ---------- */
function vfx(v) {
  if (!v.fx) v.fx = { lvl: v.V / v.cap, rgb: null, a: .25, wave: 0, phase: rnd(0, 6), bubs: [], parts: [], spl: [], dye: [], steam: [], pour: null, hold: 0, gas: 0, foam: 0,
    cloud: {}, layer: {}, T: 22, ox: 0, cuo: 0, spill: 0, ix: null, iy: null, flame: { p: [], s: [] }, seed: Math.random() * 100, spurt: 0 };
  return v.fx;
}
function resetFx(v) { const T = v.fx ? v.fx.T : 22; v.fx = null; vfx(v).T = T; }
const SETTLE = { AgCl: 24, AgI: 20, PbI2: 15, BaSO4: 8, PbSO4: 10, PbCl2: 16, Ag2O: 11, CaOH2: 8, CuOH2: 5.5, FeOH2: 5, FeOH3: 4.5, PbOH2: 6, BaCO3: 8, CaCO3: 6.5, CuCO3: 6, FeCO3: 6, PbCO3: 8 };
const BULK = { CuOH2: 3, FeOH2: 3, FeOH3: 3.2, PbOH2: 2.2, Ag2O: 1.4, CaOH2: 1.6 };
function pptRGB(k, fx) {
  let c = hex2rgb(PPT[k][1]);
  if (k === 'FeOH2' && fx.ox > 0) c = lerpC(c, [150, 75, 25], fx.ox);
  if (k === 'CuOH2' && fx.cuo > 0) c = lerpC(c, [28, 26, 24], fx.cuo);
  return c;
}
function streamRGB(b) {
  if (b.ind) return ({ litmus: [120, 55, 150], phph: [235, 235, 232], mo: [235, 130, 40], univ: [80, 160, 75] })[b.ind];
  const t = { V: 1, tot: Object.assign({}, b.tot || {}), ind: {} }; equilibrate(t); const lk = vesselLook(t);

  'sc.ind1.title': 'Acid, alkali or water?', 'sc.ind1.short': 'Identify three unlabelled bottles with indicators.',
  'sc.ind1.goal': 'Bottles A, B and C contain hydrochloric acid, sodium hydroxide solution and distilled water, but the labels are missing. Use indicators to find out which bottle is acidic, which is alkaline and which is neutral.',

  'sc.ind1.hint': 'Phenolphthalein turns crimson only in alkali. Methyl orange is red in acid. Litmus is red in acid, blue in alkali and purple in neutral solution.',
  'sc.ind2.title': 'Five unlabelled solutions', 'sc.ind2.short': 'Use pH and extra tests to tell salts, acids and alkalis apart.',
  'sc.ind2.goal': 'Bottles A–E contain 0.1 M HCl, NaOH, NaCl, Na₂CO₃ and NH₄Cl. Some salts also change the pH (hydrolysis). Estimate the pH of each solution and use extra tests where needed to identify every bottle.',
  'sc.ind2.steps': 'Put on goggles.|Test a sample of each bottle with pH paper or universal indicator and compare with the colour chart.|Two bottles are alkaline. Add hydrochloric acid to a sample of each: a carbonate fizzes.|Two bottles are acidic. A strong acid has a much lower pH than a salt of a weak base.|Identify each bottle and check your answer.',
  'sc.ind2.hint': 'Approximate pH: HCl ≈ 1, NH₄Cl ≈ 5, NaCl ≈ 7, Na₂CO₃ ≈ 11.5, NaOH ≈ 13.',
  'sc.ind3.title': 'Strong and weak electrolytes', 'sc.ind3.short': 'Measure pH precisely and calculate pKₐ of acetic acid.',
  'sc.ind3.goal': 'Bottles A–F contain 0.1 M HCl, CH₃COOH, NaOH, NH₃ (aq), CH₃COONa and NH₄Cl. Measure the pH of each with a pH meter, identify the solutions, and calculate pKₐ of acetic acid from your measurement.',
  'sc.ind3.steps': 'Put on goggles.|Measure the pH of a sample from each bottle with the pH meter.|Pair them: strong acid and weak acid, strong base and weak base, and two salts that hydrolyse.|For a 0.1 M weak acid, Kₐ ≈ [H⁺]² / c and pKₐ = −log Kₐ.|Enter the identities and pKₐ, then check.',
  'sc.ind3.hint': '0.1 M HCl has pH 1.0 and 0.1 M CH₃COOH about 2.9. With [H⁺] = 10^−pH, Kₐ = [H⁺]² / 0.1.',
  'sc.neu1.title': 'Make table salt', 'sc.neu1.short': 'Neutralise hydrochloric acid exactly and crystallise the salt.',
  'sc.neu1.goal': 'The beaker holds 10 mL of 0.1 M hydrochloric acid. Neutralise it exactly with 0.1 M sodium hydroxide, then evaporate the water to obtain crystals of the salt.',

  'sc.neu1.hint': '10 mL of 0.1 M HCl needs exactly 10 mL of 0.1 M NaOH. Add 9 mL, then single drops.',
  'sc.neu2.title': 'Titration of an unknown acid', 'sc.neu2.short': 'Find the concentration of HCl with a burette.',
  'sc.neu2.goal': 'Find the concentration of hydrochloric acid X by titrating it with 0.100 M NaOH from a burette.',

  'sc.neu2.hint': 'HCl + NaOH → NaCl + H₂O, ratio 1 : 1. Use the burette reading at the first permanent colour change.',
  'sc.neu3.title': 'Weak acid titration curve', 'sc.neu3.short': 'Record a pH curve, find concentration and pKₐ, choose an indicator.',
  'sc.neu3.goal': 'Acetic acid Y has an unknown concentration. Titrate it with 0.100 M NaOH, record the titration curve with a pH meter, choose a suitable indicator, and find the concentration and pKₐ.',

  'sc.neu3.hint': 'The salt CH₃COONa is basic, so the equivalence point is above pH 7. Methyl orange changes colour much too early.',
  'sc.pre1.title': 'Three precipitates', 'sc.pre1.short': 'Get Cu(OH)₂, AgCl and BaSO₄ by mixing solutions.',
  'sc.pre1.goal': 'Using the solutions on the shelf, obtain in separate test tubes: a blue precipitate of copper(II) hydroxide, a white precipitate of silver chloride and a white precipitate of barium sulfate.',
  'sc.pre1.steps': 'Put on goggles.|Decide which two solutions contain the ions needed for each precipitate.|Pour about 1 mL of each into a test tube and observe.|When all three precipitates are in the tubes, check your work.',
  'sc.pre1.hint': 'Cu(OH)₂ needs Cu²⁺ and OH⁻. AgCl needs Ag⁺ and Cl⁻. BaSO₄ needs Ba²⁺ and SO₄²⁻.',
  'sc.pre2.title': 'Identify the anion', 'sc.pre2.short': 'Tell chloride, sulfate, carbonate and nitrate apart.',
  'sc.pre2.goal': 'Bottles A–D contain NaCl, Na₂SO₄, Na₂CO₃ and NaNO₃. All are colourless. Use silver nitrate, barium chloride and hydrochloric acid to identify each bottle.',
  'sc.pre2.steps': 'Put on goggles.|Take a sample of each bottle and add hydrochloric acid. Note any gas.|Test fresh samples with barium chloride. Check whether any precipitate dissolves in acid.|Test fresh samples with silver nitrate.|Identify each bottle and check.',
  'sc.pre2.hint': 'Cl⁻ + Ag⁺ → white AgCl. SO₄²⁻ + Ba²⁺ → white BaSO₄, which does not dissolve in acid. CO₃²⁻ fizzes with acid, and BaCO₃ dissolves in acid. Nitrate gives no precipitate.',
  'sc.pre3.title': 'Qualitative analysis of ions', 'sc.pre3.short': 'Identify six salts from colours, precipitates and cross-reactions.',
  'sc.pre3.goal': 'Bottles A–F contain CuSO₄, FeCl₃, FeSO₄, Pb(NO₃)₂, KI and AgNO₃. Use colour, the reagents on the shelf and reactions between the unknowns to identify every bottle.',
  'sc.pre3.steps': 'Put on goggles.|Look at the colours of the solutions.|Test each with sodium hydroxide and note the colour of the hydroxide precipitate.|Use BaCl₂, HCl and Na₂SO₄ for anions and for Pb²⁺/Ag⁺.|Mix unknowns with each other: iodide gives coloured precipitates with Pb²⁺ and Ag⁺.|Identify every bottle and check.',
  'sc.pre3.hint': 'Hydroxides: Cu(OH)₂ blue, Fe(OH)₃ red-brown, Fe(OH)₂ dirty green, Pb(OH)₂ white, Ag₂O brown. Iodide gives bright yellow PbI₂ and pale yellow AgI. PbSO₄ is white, Ag⁺ gives no precipitate with sulfate.',
  'sc.org1.title': 'Products of combustion', 'sc.org1.short': 'Burn ethanol and methane and prove CO₂ and H₂O form.',
  'sc.org1.goal': 'Burn ethanol in a spirit lamp and methane in a gas burner. Prove which substances form when they burn, and see what changes when there is not enough air.',

  'sc.org1.hint': 'Water condenses on cold glass and turns cobalt chloride paper pink. CO₂ turns limewater milky. A yellow, smoky flame means incomplete combustion: soot (C) and carbon monoxide.',
  'sc.org2.title': 'Distilling ethanol', 'sc.org2.short': 'Assemble a still and collect an ethanol-rich fraction.',
  'sc.org2.goal': 'The flask holds 50 mL of a fermented mixture with about 25 % ethanol by volume. Assemble the apparatus correctly, distil, and collect a fraction of at least 4 mL that contains at least 60 % ethanol. Prove that it burns.',

  'sc.org2.hint': 'Ethanol boils at 78 °C and water at 100 °C. The first part of the distillate is richest in ethanol. Electric heating or a water bath is safer than an open flame.',
  'sc.org3.title': 'Combustion analysis', 'sc.org3.short': 'Find a molecular formula from CO₂ and H₂O masses.',
  'sc.org3.goal': 'Find the molecular formula of an unknown organic compound that contains carbon, hydrogen and possibly oxygen. Burn a weighed sample, absorb the water and the carbon dioxide, and calculate the formula.',

  'sc.org3.hint': 'Water must be absorbed first, by CaCl₂: NaOH absorbs both H₂O and CO₂. Without excess oxygen part of the carbon becomes CO and is not absorbed.',

  "sc.ind1.steps": "Наденьте защитные очки (нажмите на них на крючке).|Возьмите склянку A, держите её над пустой пробиркой, пока не нальётся около 1 мл. То же для B и C.|Добавьте капли индикатора пипеткой и отметьте цвет. Попробуйте хотя бы два разных индикатора.|Выберите вывод для каждой склянки и проверьте ответ.",
  "sc.neu1.steps": "Наденьте очки.|Добавьте пипеткой несколько капель фенолфталеина к кислоте.|Наливайте NaOH: сначала струёй, у точки эквивалентности — по каплям.|Остановитесь при первой бледно-розовой окраске, которая не исчезает. Если перелили, добавьте каплю кислоты.|Поставьте спиртовку под стакан, чтобы выпарить воду, и назовите соль.",
  "sc.neu2.steps": "Наденьте очки.|Держите пипетку над колбой, чтобы отмерить 10,00 мл кислоты X, затем добавьте индикатор.|Сдвиньте кран бюретки вправо: сначала струя, затем отдельные капли. Закройте кран в точке эквивалентности и снимите показание.|Для повтора налейте NaOH в верх бюретки и используйте вторую колбу.|Вычислите c(HCl) = c(NaOH) × V(NaOH) / V(HCl) и проверьте.",
  "sc.neu3.steps": "Наденьте очки.|Отмерьте пипеткой 10,00 мл Y в колбу и опустите в неё pH-электрод.|Открывайте кран бюретки понемногу. У крутого участка кривой добавляйте по одной капле.|Точка эквивалентности — середина скачка. При половине эквивалентного объёма pH = pKₐ.|Решите, какой индикатор меняет цвет в точке эквивалентности, и проверьте результаты.",
  "sc.org1.steps": "Наденьте очки.|Снимите колпачок со спиртовки и зажгите её спичкой. Для горелки откройте газовый кран и зажгите её.|Подержите над пламенем холодное сухое стекло. Коснитесь капель бумажкой с хлоридом кобальта.|Подержите воронку над пламенем, чтобы газы проходили через известковую воду.|Закройте регулятор воздуха горелки и внесите в пламя фарфоровую чашку.|Наденьте колпачок на спиртовку и закройте газовый кран, затем ответьте на вопросы.",
  "sc.org2.steps": "Наденьте очки.|Бросьте в колбу кипелки, поставьте под неё безопасный нагреватель и установите шарик термометра на уровне отводной трубки.|Подключите шланг к нижнему штуцеру холодильника и откройте кран. Нажмите на нагреватель, чтобы включить его.|Следите за термометром. Поставьте новый приёмник, когда температура поднимется выше примерно 90 °C.|Опустите спиртомер в каждый приёмник, проверьте горящей спичкой и выберите лучшую фракцию.",
  "sc.org3.steps": "Подключите газовый шланг к баллону с кислородом или к воздушному насосу.|Поставьте две поглотительные трубки в установку в правильном порядке.|Наденьте очки. Взвесьте каждую трубку на весах, нажмите выключатель печи, затем снова взвесьте трубки.|n(C) = n(CO₂); n(H) = 2·n(H₂O); m(O) = m(образца) − m(C) − m(H).|Найдите простейшую формулу, затем по M — молекулярную, и проверьте.",

  'sc.ind1.title': 'Кислота, щёлочь или вода?', 'sc.ind1.short': 'Определите три склянки без этикеток с помощью индикаторов.',
  'sc.ind1.goal': 'В склянках A, B и C находятся соляная кислота, раствор гидроксида натрия и дистиллированная вода, но этикетки потерялись. С помощью индикаторов выясните, где кислота, где щёлочь, а где нейтральный раствор.',

  'sc.ind1.hint': 'Фенолфталеин становится малиновым только в щёлочи. Метиловый оранжевый красный в кислоте. Лакмус красный в кислоте, синий в щёлочи и фиолетовый в нейтральной среде.',
  'sc.ind2.title': 'Пять растворов без этикеток', 'sc.ind2.short': 'По pH и дополнительным опытам различите соли, кислоты и щёлочи.',
  'sc.ind2.goal': 'В склянках A–E находятся 0,1 М HCl, NaOH, NaCl, Na₂CO₃ и NH₄Cl. Некоторые соли тоже меняют pH (гидролиз). Оцените pH каждого раствора и при необходимости проведите дополнительные опыты, чтобы определить все склянки.',
  'sc.ind2.steps': 'Наденьте очки.|Проверьте пробу из каждой склянки индикаторной бумагой или универсальным индикатором и сравните со шкалой.|Две склянки щелочные. Добавьте к пробе каждой соляную кислоту: карбонат вскипает.|Две склянки кислые. У сильной кислоты pH намного ниже, чем у соли слабого основания.|Определите каждую склянку и проверьте ответ.',
  'sc.ind2.hint': 'Примерный pH: HCl ≈ 1, NH₄Cl ≈ 5, NaCl ≈ 7, Na₂CO₃ ≈ 11,5, NaOH ≈ 13.',
  'sc.ind3.title': 'Сильные и слабые электролиты', 'sc.ind3.short': 'Точно измерьте pH и рассчитайте pKₐ уксусной кислоты.',
  'sc.ind3.goal': 'В склянках A–F находятся 0,1 М HCl, CH₃COOH, NaOH, NH₃ (водн.), CH₃COONa и NH₄Cl. Измерьте pH каждого раствора pH-метром, определите растворы и по своему измерению вычислите pKₐ уксусной кислоты.',
  'sc.ind3.steps': 'Наденьте очки.|Измерьте pH пробы из каждой склянки pH-метром.|Составьте пары: сильная и слабая кислота, сильное и слабое основание, две гидролизующиеся соли.|Для 0,1 М слабой кислоты Kₐ ≈ [H⁺]² / c, pKₐ = −lg Kₐ.|Введите вещества и pKₐ, затем проверьте.',
  'sc.ind3.hint': '0,1 М HCl имеет pH 1,0, а 0,1 М CH₃COOH — около 2,9. При [H⁺] = 10^−pH: Kₐ = [H⁺]² / 0,1.',
  'sc.neu1.title': 'Получаем поваренную соль', 'sc.neu1.short': 'Точно нейтрализуйте соляную кислоту и выделите соль.',
  'sc.neu1.goal': 'В стакане 10 мл 0,1 М соляной кислоты. Точно нейтрализуйте её 0,1 М раствором гидроксида натрия, затем выпарите воду и получите кристаллы соли.',

  'sc.neu1.hint': 'На 10 мл 0,1 М HCl нужно ровно 10 мл 0,1 М NaOH. Добавьте 9 мл, затем по одной капле.',
  'sc.neu2.title': 'Титрование неизвестной кислоты', 'sc.neu2.short': 'Определите концентрацию HCl с помощью бюретки.',
  'sc.neu2.goal': 'Определите концентрацию соляной кислоты X титрованием 0,100 М раствором NaOH из бюретки.',

  'sc.neu2.hint': 'HCl + NaOH → NaCl + H₂O, соотношение 1 : 1. Используйте объём по бюретке при первом устойчивом изменении цвета.',
  'sc.neu3.title': 'Кривая титрования слабой кислоты', 'sc.neu3.short': 'Запишите кривую pH, найдите концентрацию и pKₐ, выберите индикатор.',
  'sc.neu3.goal': 'Концентрация уксусной кислоты Y неизвестна. Оттитруйте её 0,100 М NaOH, запишите кривую титрования pH-метром, выберите подходящий индикатор и найдите концентрацию и pKₐ.',

  'sc.neu3.hint': 'Соль CH₃COONa имеет щелочную среду, поэтому точка эквивалентности выше pH 7. Метиловый оранжевый меняет цвет слишком рано.',
  'sc.pre1.title': 'Три осадка', 'sc.pre1.short': 'Получите Cu(OH)₂, AgCl и BaSO₄, смешивая растворы.',
  'sc.pre1.goal': 'Используя растворы с полки, получите в разных пробирках: синий осадок гидроксида меди(II), белый осадок хлорида серебра и белый осадок сульфата бария.',
  'sc.pre1.steps': 'Наденьте очки.|Подумайте, в каких двух растворах есть ионы для каждого осадка.|Налейте в пробирку примерно по 1 мл каждого и наблюдайте.|Когда все три осадка будут в пробирках, проверьте работу.',
  'sc.pre1.hint': 'Для Cu(OH)₂ нужны Cu²⁺ и OH⁻. Для AgCl — Ag⁺ и Cl⁻. Для BaSO₄ — Ba²⁺ и SO₄²⁻.',
  'sc.pre2.title': 'Определите анион', 'sc.pre2.short': 'Различите хлорид, сульфат, карбонат и нитрат.',
  'sc.pre2.goal': 'В склянках A–D находятся NaCl, Na₂SO₄, Na₂CO₃ и NaNO₃. Все растворы бесцветные. С помощью нитрата серебра, хлорида бария и соляной кислоты определите каждую склянку.',
  'sc.pre2.steps': 'Наденьте очки.|Возьмите пробу из каждой склянки и добавьте соляную кислоту. Отметьте выделение газа.|Проверьте новые пробы хлоридом бария. Выясните, растворяется ли осадок в кислоте.|Проверьте новые пробы нитратом серебра.|Определите каждую склянку и проверьте.',
  'sc.pre2.hint': 'Cl⁻ + Ag⁺ → белый AgCl. SO₄²⁻ + Ba²⁺ → белый BaSO₄, нерастворимый в кислоте. CO₃²⁻ вскипает с кислотой, а BaCO₃ в кислоте растворяется. Нитрат осадка не даёт.',
  'sc.pre3.title': 'Качественный анализ ионов', 'sc.pre3.short': 'Определите шесть солей по цвету, осадкам и взаимным реакциям.',
  'sc.pre3.goal': 'В склянках A–F находятся CuSO₄, FeCl₃, FeSO₄, Pb(NO₃)₂, KI и AgNO₃. Используя цвет, реактивы с полки и реакции неизвестных растворов друг с другом, определите каждую склянку.',

const S = {
  lang: 'en', view: 'home', tab: 'assign', owner: false, uid: null, profileName: '', name: '',

  results: [], myRuns: {}, run: null, resFilter: null, openRow: null, pendingAssign: null, delConfirm: null, resetConfirm: false,

const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

function T(key, p) {
  let s = (I18N[S.lang] && I18N[S.lang][key]);
  if (s == null) s = I18N.en[key];
  if (s == null) return key;

  return s;
}
window.T = T;
const Lbl = l => (l && typeof l === 'object') ? l.raw : T(l);

function h(tag, props, ...kids) {

    const v = props[k]; if (v == null || v === false) continue;

}
const fmt = (x, d) => Number(x).toFixed(d).replace('.', S.lang === 'en' ? '.' : ',');
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let toastTimer;
function toast(msg, kind) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast', 3200);
}

/* ---------- run lifecycle ---------- */
function newRun(scId, assignId, keepCounters) {
  const sc = SC[scId];
  const key = assignId ? 'a_' + assignId : 'free_' + scId;
  const prior = keepCounters || S.myRuns[key] || {};
  const run = {
    sc, scId, assignId: assignId || null, key, secret: {}, flags: {}, log: [], mistakes: (prior.mistakes || []).slice(),
    attempts: prior.attempts || 0, retries: prior.retries || 0, success: !!prior.success, everSuccess: !!prior.success,
    startedAt: prior.startedAt || Date.now(), t0: Date.now(), secsPrior: prior.secs || 0,
    amount: 1, sel: 0, goggles: false, answers: {}, wrong: [], burette: { used: 0 }, reading: null, mistakeOnce: {}, solvedNow: false,
  };
  sc.setup(run);
  run.jobs = [];
  if (run.tools && sc.kind === 'bench' && !['neu2', 'neu3'].includes(scId) && !run.tools.includes('heat')) run.tools.splice(run.tools.indexOf('empty'), 0, 'heat');
  if (run.vessels) for (const v of run.vessels) {
    v.V = 0; v.tot = {}; v.ind = {}; v.residue = null; v.curve = []; v.fx = null; v.heating = false;
    if (v.pre) { v.V = v.pre.V; for (const k in R[v.pre.rid].tot) v.tot[k] = R[v.pre.rid].tot[k] * v.V; }
    equilibrate(v);
  }

}
const elapsed = () => S.run ? (Date.now() - S.run.t0) / 1000 : 0;
function logE(type, parts, head) { S.run.log.push({ t: elapsed(), type, parts, head }); }
function mistake(k, p, once) {
  const run = S.run;
  if (once !== false && run.mistakeOnce[k]) return;
  run.mistakeOnce[k] = true;
  run.mistakes.push({ k, p: p || null, t: Math.round(elapsed()), at: Date.now() });
  if (run.mistakes.length > 80) run.mistakes.shift();
  logE('mistake', [['m.' + k, p]]);
  toast(T('m.' + k, p), 'err');
}
function needGoggles() {
  if (S.run.goggles) return true;
  mistake('goggles'); toast(T('tip.goggles'), 'err'); if (typeof refreshLog === 'function') refreshLog(); return false;
}

/* ---------- bench actions ---------- */
function snapV(v) {
  const e = v.eq || { ppt: {} }; const p = {};
  for (const k in e.ppt) if (e.ppt[k] > 0.0015) p[k] = e.ppt[k];
  const lk = vesselLook(v); return { p, ind: lk.indKey, inds: lk.inds.length, base: lk.baseKey, pH: e.pH };
}
function describe(b, a, gas, addedInd) {
  const out = [];
  for (const k in a.p) if (!b.p[k]) out.push(['obs.ppt', { c: { k: 'col.' + PPT[k][0] } }]);
  let dis = false; for (const k in b.p) if (!a.p[k] && b.p[k] > 0.002) dis = true;
  if (dis) out.push(['obs.dissolve']);
  else for (const k in a.p) if (b.p[k] && a.p[k] < b.p[k] * 0.5) { out.push(['obs.partDissolve']); break; }
  if (gas > 0.003) out.push(['obs.gas']);
  if (a.inds) { if (addedInd || a.ind !== b.ind) out.push(['obs.ind', { c: { k: 'col.' + a.ind } }]); }
  else if (a.base !== b.base && a.base !== 'colourless') out.push(['obs.colour', { c: { k: 'col.' + a.base } }]);
  if (!out.length) out.push(['obs.none']);
  return out;
}
function addReagent(b) {
  const run = S.run; if (!needGoggles()) return;
  const v = run.vessels[run.sel]; if (!v) return;
  let amt = run.amount, amtLbl;
  if (b.ind) { amt = 0.1; amtLbl = T('amt.2drops'); }
  else if (b.pipette) { amt = b.pipette; amtLbl = '10.00 mL'; }
  else amtLbl = amt === 0.05 ? T('amt.drop') : fmt(amt, amt < 1 ? 2 : 1) + ' mL';
  if (b.burette) {
    if (run.burette.used + amt > 50.0001) { toast(T('tip.buretteEmpty'), 'err'); return; }
    run.burette.used = Math.round((run.burette.used + amt) * 100) / 100;
  }
  if (v.evap) { toast(T('tip.busy'), 'err'); return; }
  const before = snapV(v);
  startPour(v, b, amt);
  v.V += amt;
  if (b.ind) v.ind[b.ind] = (v.ind[b.ind] || 0) + 1;
  else for (const k in b.tot) v.tot[k] = (v.tot[k] || 0) + b.tot[k] * amt;

  if (v.V > v.cap) { const keep = v.cap * 0.9 / v.V; for (const k in v.tot) v.tot[k] *= keep; v.V = v.cap * 0.9; spilled = true; vfx(v).spill = 2.2; }
  if (amt >= 0.5) vfx(v).stir = Math.min(.7, amt / v.cap * 4);
  const gas = equilibrate(v);
  if (gas > 0) vfx(v).gas += gas * 1.4 + (gas > 0.003 ? 0.03 : 0);
  const after = snapV(v);
  const parts = describe(before, after, gas, !!b.ind);
  logE('obs', parts, { v: v.label, amt: amtLbl, f: b.k === 'unk' ? b.f : b.f });
  if (spilled) mistake('overflow', null, false);
  if (v.meter && run.sc.id === 'neu3') v.curve.push([run.burette.used, v.eq.pH]);
  if (run.watchOvershoot && v.ind.phph && v.eq.pH > 11 && (v.tot.Cl || 0) > 0) { if (!run.flags.overNow) { run.flags.overNow = true; mistake('overshoot', null, false); } }

}
function tool(name) {
  const run = S.run; const v = run.vessels && run.vessels[run.sel];
  if (name === 'refill') { run.burette.used = 0; logE('info', [['log.refill']]); render(); return; }
  if (!v) return;
  if (name === 'empty') { v.V = 0; v.tot = {}; v.ind = {}; v.residue = null; v.curve = []; v.meter = false; v.heating = false; v.evap = false; resetFx(v); equilibrate(v); logE('info', [['log.empty', { v: v.label }]]); run.reading = null; render(); return; }
  if (!needGoggles()) return;
  if (name === 'heat') {
    if (v.evap) return;
    if (!v.heating && v.V < 0.05) { toast(T('tip.emptyVessel'), 'err'); return; }
    v.heating = !v.heating;
    logE('info', [[v.heating ? 'log.heatOn' : 'log.heatStop', { v: v.label }]]);
    if (v.heating && v.kind === 'tube' && v.V > v.cap / 3) mistake('heatFull', null, false);

    run.reading = { kind: 'litmus', pH, v: v.label };

  } else if (name === 'phMeter') {
    const val = pH + (Math.random() - .5) * .04; run.reading = { kind: 'meter', val, v: v.label };

    v.meter = !v.meter;
    if (v.meter && v.V > 0) v.curve.push([run.burette.used, v.eq.pH]);

    if (v.evap) return;
    v.evap = true; v.heating = true; logE('info', [['log.evapStart', { v: v.label }]]);

}

function evapFinish(v) {
  const run = S.run;
  const ex = (v.tot.Na || 0) - (v.tot.Cl || 0) - 2 * (v.tot.SO4 || 0);
  const neutral = Math.abs(ex) <= 0.006;

    else { run.flags.saltOK = false; logE('obs', [[ex < 0 ? 'obs.evapAcid' : 'obs.evapBase']]); mistake('evapNotNeutral', null, false); }
  } else logE('obs', [['obs.evap']]);

function tokens() { const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue(n).trim(); return { ink: g('--ink'), muted: g('--muted'), line: g('--line'), accent: g('--accent'), amber: g('--amber') }; }

  const xs = xMax <= 20 ? 5 : 10;
  for (let x = 0; x <= xMax; x += xs) { const px = pad.l + x / xMax * (W - pad.l - pad.r); ctx.fillText(String(x), px - 4, H - pad.b + 13); }
  ctx.fillText(xl, W - pad.r - ctx.measureText(xl).width, H - 2); ctx.fillText(yl, pad.l + 2, 10);
}
function drawTitCurve() {

  const run = S.run; const v = run.vessels.find(x => x.meter) || run.focus || run.vessels[0]; const pts = (v.curve || []).slice().sort((a, b) => a[0] - b[0]);
  const ctx = cv.getContext('2d'), W = cv.width, H = cv.height, pad = { l: 24, r: 8, t: 14, b: 22 }, tk = tokens();
  const xMax = Math.max(20, Math.ceil(((pts.length ? pts[pts.length - 1][0] : 0) + 1) / 5) * 5);
  drawAxes(ctx, W, H, pad, xMax, 0, 14, 'V(NaOH), mL', 'pH', tk, 2);
  if (!pts.length) { ctx.fillStyle = tk.muted; ctx.fillText(T('lbl.curveEmpty'), pad.l + 10, H / 2); return; }
  const X = x => pad.l + x / xMax * (W - pad.l - pad.r), Y = y => H - pad.b - y / 14 * (H - pad.t - pad.b);
  ctx.strokeStyle = tk.accent; ctx.lineWidth = 2; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))); ctx.stroke();

/* ---------- distillation ---------- */
let simTimer = null;
function stopSim() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }
function distTick() {
  const run = S.run; if (!run || !run.dist) return stopSim();
  const d = run.dist; if (!d.heating) return;
  const dt = 0.1 * d.speed;
  for (let step = 0; step < 4; step++) distStep(run, d, dt / 4);
  if (Math.round(d.t) % 2 === 0) { const vtot = d.rec.reduce((s, r) => s + mixVol(r.nE, r.nW), 0); const last = d.curve[d.curve.length - 1]; if (!last || vtot - last[0] > 0.05 || d.t - last[2] > 5) d.curve.push([vtot, d.Tth, d.t]); }
  updateDistill();
}
function distStep(run, d, dt) {
  const n = d.nE + d.nW; if (n <= 0) { d.heating = false; return; }
  const x = d.nE / n;
  let [y, bp] = vle(x);
  let Ttop = bp;
  if (d.column) { let yy = y, xl = x; for (let i = 0; i < 2; i++) { xl = yy; [yy] = vle(xl); } Ttop = vle(xl)[1]; y = yy; }
  const P = !d.src ? 0 : d.src === 'burner' ? 110 : d.src === 'mantle' ? 60 : Math.max(0, 2.4 * (99.5 - d.T));
  const C = d.nE * 112 + d.nW * 75.3 + 60;
  let boiling = false;
  d.rateMl = 0; d.escMl = 0;
  if (d.T < bp - 0.01) { d.T = Math.min(bp, d.T + P * dt / C); d.ring = Math.max(0, (d.ring || 0) - dt * .01); }
  else {
    boiling = true; d.T = bp;
    if (!d.boilT) { d.boilT = d.t; logE('obs', [['obs.boil', { t: fmt(bp, 1) }]]); }
    const prevRing = d.ring || 0;
    d.ring = Math.min(1.3, prevRing + dt * (P / 60) * (d.column ? .011 : .02));
    if (prevRing < .05 && d.ring >= .05) logE('obs', [['obs.ring']]);
    if (prevRing < 1 && d.ring >= 1) logE('obs', [['obs.vapThermo']]);
    if (prevRing < 1 && d.ring >= 1) { if (d.thermo === 'liquid') mistake('thermoLiquid'); else if (d.thermo === 'above') mistake('thermoHigh'); else if (d.thermo === 'below') mistake('thermoLow'); }
    if (d.ring < 1.1) { d.Tth += ((d.thermo === 'liquid' ? d.T : 20 + d.ring * 6) - d.Tth) * Math.min(1, dt * .2); d.t += dt; d.boiling = true; return; }
    if (prevRing < 1.1 && d.ring >= 1.1) logE('obs', [['obs.firstDrops']]);
    const Hv = x * 38600 + (1 - x) * 40700;
    let dn = P * dt / Hv * (d.column ? 0.7 : 1);
    let dE = Math.min(d.nE, dn * y), dW = Math.min(d.nW, dn * (1 - y));
    d.nE -= dE; d.nW -= dW;
    const eff = !d.tap || !d.water ? 0.1 : d.water === 'top' ? 0.55 : 1;
    const r = d.cur >= 0 ? d.rec[d.cur] : null; if (r) { r.nE += dE * eff; r.nW += dW * eff; } else mistake('noReceiver');
    d.rateMl = mixVol(dE, dW) * eff / dt; d.escMl = mixVol(dE, dW) * (1 - eff) / dt;
    if (!d.tap || !d.water) mistake('waterOff');
    else if (d.water === 'top') mistake('condenserTop');
    if (eff < 1 && d.src === 'burner') { d.esc = (d.esc || 0) + (dE + dW) * (1 - eff); if (d.esc > 0.004) { d.fire = true; d.heating = false; mistake('fire', null, false); logE('mistake', [['obs.fire']]); stopSim(); render(); return; } }
    if (!d.chips && !d.bumped && d.t - d.boilT > 8 && Math.random() < 0.05 * dt) {
      d.bumped = true; const mv = 3 / mixVol(d.nE, d.nW); const bE = d.nE * mv, bW = d.nW * mv; d.nE -= bE; d.nW -= bW; r.nE += bE; r.nW += bW;
      mistake('noChips', null, false); logE('mistake', [['obs.bump']]); d.bumpFx = .4; logDirty = true;
    }
    if (mixVol(d.nE, d.nW) < 4) { d.heating = false; mistake('dryness', null, false); stopSim(); logDirty = true; return; }
  }
  d.boiling = boiling;
  // thermometer
  if (d.thermo === 'liquid') d.Tth = d.T;
  else { const target = boiling && d.ring >= 1 ? Ttop + (d.thermo === 'below' ? 2.5 : d.thermo === 'above' ? -9 : 0) : Math.max(20, 20 + (d.ring || 0) * 6); d.Tth += (target - d.Tth) * Math.min(1, dt * (boiling ? 0.25 : 0.05)); }
  d.t += dt;
}

/* ===================== BOOT ===================== */
function pickLang() {
  const saved = LS.get('lab.lang'); if (saved && I18N[saved]) return saved;
  const n = (navigator.language || 'en').slice(0, 2); return n === 'et' ? 'et' : n === 'uk' ? 'uk' : n === 'ru' ? 'ru' : 'en';
}
async function boot() {
  S.lang = pickLang(); S.name = LS.get('lab.name') || '';
  const sel = document.getElementById('lang');
  sel.addEventListener('change', e => { S.lang = e.target.value; LS.set('lab.lang', S.lang); render(); });
  render();
  const cl = window.claude;
  if (!cl || !cl.use) { S.dbReady = true; S.db = null; render(); return; }
  try { S.user = await cl.use('user'); } catch (e) { S.user = null; }
  try { S.db = await cl.use('db'); } catch (e) { S.db = null; }
  if (S.user) {
    try { const me = await S.user.me(); S.owner = !!me.isOwner; S.uid = me.id; S.profileName = me.name || ''; if (!S.name && S.profileName) { S.name = S.profileName; } } catch (e) { }
  }
  if (S.db) {
    S.db.collection('assignments').onSnapshot(snap => {
      S.assignments = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      S.dbReady = true; if (S.view === 'home') render();
    }, () => { S.dbReady = true; render(); });
    S.db.doc('settings/main').onSnapshot(d => { if (d.exists) S.settings = Object.assign({ practice: true }, d.data()); if (S.view === 'home') render(); }, () => { });
    if (S.owner) {
      S.db.collection('results').onSnapshot(snap => { S.results = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); if (S.view === 'home') render(); }, () => { });
    } else if (S.uid) {
      S.db.doc('results/' + S.uid).onSnapshot(d => { if (d.exists) { const data = d.data(); const runs = data.runs || {}; for (const k in runs) if (!S.myRuns[k] || (runs[k].updatedAt || 0) > (S.myRuns[k].updatedAt || 0)) S.myRuns[k] = runs[k]; if (!S.name && data.name) S.name = data.name; } if (S.view === 'home') render(); }, () => { });
    } else S.canSave = false;
    try { if (S.user && !S.owner) { const c = await S.user.can('data.write'); if (c === false) { /* own subtree rule may still allow; test on first save */ } } } catch (e) { }
  } else { S.dbReady = true; S.canSave = false; }
  setTimeout(() => { S.dbReady = true; if (S.view === 'home') render(); }, 4000);
  render();
}
document.addEventListener('DOMContentLoaded', boot);
requestAnimationFrame(fxLoop);
