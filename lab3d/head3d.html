<title>Chemistry Bench 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: full-bleed 3D bench on top, a slim lab card (task, live readings, notebook) beside it on wide screens and below it on phones. */
:root {
  --bg: #E7ECEA; --surface: #FAFBFA; --sunk: #DCE3E0; --ink: #15201D; --muted: #55645E; --line: #C3CEC9;
  --accent: #0B6B63; --accent-ink: #fff; --amber: #B5620C; --ok: #2C7A48; --err: #B3261E;
  --f-display: 'Unbounded', system-ui, sans-serif; --f-body: 'IBM Plex Sans', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; } body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top b { font: 600 15px/1.2 var(--f-display); } .top small { color: var(--muted); display: block; font-size: 12px; }
.top .sp { flex: 1; }
.top select, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font: inherit; color: inherit; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.wrap { display: block; padding: 14px 16px 30px; max-width: 1600px; margin: 0 auto; }
.stage { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; position: relative; border-radius: 12px; overflow: hidden; background: #eef2f1; min-height: 360px; height: min(72vh, 680px); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.col { display: grid; gap: 6px; align-content: start; min-width: 0; }
.hint { margin: 0; color: var(--muted); font-size: 13px; padding: 0 4px; }
.helpbanner { left: 50% !important; top: 56px !important; transform: translateX(-50%) !important; }
.note { position: absolute; z-index: 4; width: min(300px, calc(100% - 16px)); background: #FAFBFA; color: #15201D; border: 1px solid #C3CEC9; border-radius: 10px; padding: 10px 12px 12px; box-shadow: 0 6px 22px rgba(0,0,0,.18); font-size: 13.5px; line-height: 1.45; display: grid; gap: 6px; }
.note .nh { display: flex; align-items: start; gap: 8px; } .note b { flex: 1; font-size: 14px; }
.note button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: #55645E; padding: 0 2px; }
.note p { margin: 0; }
[hidden] { display: none !important; }
#invbtns { display: flex; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; overflow: hidden; flex: none; }
#invbtns button { border: 0; background: transparent; color: var(--ink); font: 600 13.5px var(--f-body); padding: 8px 12px; min-height: 38px; cursor: pointer; white-space: nowrap; }
#invbtns button + button { border-left: 1px solid var(--line); }
#invbtns button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.inv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: grid; gap: 8px; }
.invh { display: flex; align-items: baseline; gap: 10px; } .invh b { font: 600 15px var(--f-display); } .invh span { color: var(--muted); font-size: 12.5px; flex: 1; }
.invx { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
.invg { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.invi { display: grid; justify-items: center; gap: 3px; text-align: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 6px; cursor: pointer; color: var(--ink); font: 500 12.5px/1.25 var(--f-body); min-height: 96px; }
.invi svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.invi .s { font-size: 11.5px; color: var(--accent); font-weight: 600; }
.invi.on { background: var(--sunk); } .invi.on .s { color: var(--muted); }
.invi:hover { border-color: var(--accent); }
.invmsg { background: #FFF4E5; color: #6B3A00; border: 1px solid #F0C48A; border-radius: 9px; padding: 8px 12px; font-size: 13.5px; }
.picker { position: fixed; inset: 0; z-index: 20; background: rgba(231,236,234,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; }
.pbox { background: var(--surface); color: var(--ink); border-radius: 16px; padding: 18px; width: min(760px, 100%); max-height: calc(100svh - 32px); overflow-y: auto; display: grid; gap: 12px; box-shadow: 0 10px 34px rgba(30,50,45,.18); border: 1px solid var(--line); }
.pbox h2 { font: 600 18px var(--f-display); margin: 0 0 4px; }
.labintro { margin: -4px 0 2px; color: var(--muted); }
.labfilters { display: grid; gap: 8px; padding: 10px; background: var(--sunk); border-radius: 12px; }
.filterrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filterrow > span { width: 70px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.filterrow button { border: 1px solid transparent; border-radius: 999px; padding: 5px 10px; background: var(--surface); color: var(--ink); font: 500 12.5px var(--f-body); cursor: pointer; }
.filterrow button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.filterrow button:disabled { opacity: .48; cursor: default; }
.labgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pcard { text-align: left; display: grid; gap: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); padding: 12px 14px; cursor: pointer; color: var(--ink); font: 14px/1.45 var(--f-body); }
.pcard b { font: 600 15px var(--f-body); } .pcard span { color: var(--muted); }
.pcard.free { border-color: var(--accent); } .pcard:hover { border-color: var(--accent); background: var(--surface); }
.labcard { cursor: default; align-content: start; min-height: 228px; padding: 14px; }
.labcard:hover { background: var(--bg); }
.labcard .labicon { font-size: 29px; line-height: 1; }
.labcard .labmeta { font-size: 11.5px; color: var(--accent); font-weight: 600; }
.labcard .labdesc { font-size: 13px; line-height: 1.42; }
.labactions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; padding-top: 8px; }
.labactions button { border: 1px solid var(--accent); border-radius: 8px; padding: 7px 8px; background: var(--surface); color: var(--accent); font: 600 12.5px var(--f-body); cursor: pointer; }
.labactions .start { background: var(--accent); color: var(--accent-ink); }
.labempty { color: var(--muted); text-align: center; padding: 24px; grid-column: 1 / -1; }
.freebench { justify-self: start; border: 0; background: none; color: var(--accent); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 2px; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .phead h2 { margin: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
.crumb { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; padding: 5px 11px; font: 500 13px var(--f-body); cursor: pointer; }
.crumb.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .crumb:disabled { cursor: default; }
.crumb:not(.on):not(:disabled) { color: var(--ink); }
.pcard .chip { font-style: normal; justify-self: start; font: 600 11.5px var(--f-body); letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.pcard.ready .chip { background: var(--accent); color: var(--accent-ink); }
.pcard.soon { cursor: default; } .pcard.soon:hover { border-color: var(--line); background: var(--bg); } .pcard.soon b { color: var(--muted); }
.pback { justify-self: start; border: 0; background: none; color: var(--accent); font: 600 14px var(--f-body); padding: 6px 2px; cursor: pointer; }
#invbtns .labsbtn { background: var(--accent); color: var(--accent-ink); }
.card .goal { padding: 8px 10px; border-radius: 8px; background: var(--sunk); font-size: 13.5px; } .card .goal.ok { background: #DFF3E6; color: #1E5C35; font-weight: 600; }
.nb .ok { color: var(--ok); font-weight: 600; }
@media (max-width: 600px) { .invg { grid-template-columns: repeat(3, 1fr); } .invi { min-height: 88px; font-size: 12px; } }
.loupe { position: absolute; border-radius: 3px; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.3); pointer-events: none; z-index: 2; }
/* view controls live above the bench, outside the 3D area */
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.viewbar, .places { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.viewbar .grp, .places .grp { display: flex; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; overflow: hidden; }
.viewbar button, .places button { border: 0; background: transparent; color: var(--ink); font: 500 13.5px var(--f-body); padding: 8px 12px; min-width: 40px; min-height: 38px; cursor: pointer; white-space: nowrap; }
.viewbar .grp button + button, .places .grp button + button { border-left: 1px solid var(--line); }
.viewbar button:hover, .places button:hover { background: var(--sunk); }
.viewbar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.places button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.places .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.helpbtn { margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 19px var(--f-body); cursor: pointer; flex: none; }
.helpbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (max-width: 600px) {
  .tools { flex-wrap: nowrap; } .viewbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .places { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .places .lbl { display: none; } .places .grp, .viewbar .grp { flex: none; }
  .viewbar button, .places button { padding: 8px 10px; font-size: 13px; }
  .stage { height: calc(100svh - 210px); }
}
.pill.flash { animation: flash .35s ease-out; } @keyframes flash { 0% { background: #4CBBAC; color: #062320; transform: translateX(-50%) scale(1.06); } 100% { background: rgba(255,255,255,.96); color: #15201D; transform: translateX(-50%) scale(1); } }
/* phones: compact header, bench fills most of the screen, card follows below */
@media (max-width: 600px) {
  .top { padding: 8px 10px; gap: 6px; flex-wrap: nowrap; } .top > div:first-child { min-width: 0; flex: 1; } .top .sp { display: none; } .top b { font-size: 13.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .top small { display: none; }
  .top select, .btn { padding: 6px 10px; font-size: 14px; }
  .wrap { padding: 8px 8px 24px; gap: 10px; }
  .stage { height: calc(100svh - 172px); min-height: 380px; border-radius: 10px; }
  .col, .tools, .places { min-width: 0; max-width: 100%; } .tools .viewbar { min-width: 0; flex: 0 1 auto; } .tools > :not(.viewbar) { flex: none; }
  .pill { font-size: 14px; top: 6px !important; }
  .hint { font-size: 12.5px; }
}
.pill { left: 50% !important; top: 10px !important; transform: translateX(-50%) !important; font-size: 15px; padding: 8px 14px; border-radius: 999px; max-width: calc(100% - 20px); text-align: center; white-space: normal; }
.tip { position: absolute; padding: 5px 10px; background: rgba(255,255,255,.96); color: #15201D; border: 1px solid #C3CEC9; box-shadow: 0 2px 8px rgba(30,50,45,.15); border-radius: 8px; font-size: 13px; pointer-events: none; white-space: normal; max-width: 320px; line-height: 1.35; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #55645E; font: 500 14px var(--f-body); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card h1 { font: 600 18px/1.25 var(--f-display); margin: 0; }
.card p { margin: 0; }
.itabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 10px; }
.itabs button { border: 0; border-radius: 7px; padding: 7px 9px; background: transparent; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; }
.itabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(30,50,45,.12); }
.curriculum { color: var(--muted); font-size: 12.5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.instruction-banner { display: flex; gap: 9px; align-items: center; padding: 9px 11px; border-radius: 10px; background: #E4F3F0; border-left: 4px solid var(--accent); color: #164E48; font-weight: 600; }
.student-steps { padding: 0; list-style: none; counter-reset: labstep; gap: 8px; }
.student-steps li { counter-increment: labstep; position: relative; padding: 9px 10px 9px 43px; min-height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
.student-steps li::before { content: counter(labstep); position: absolute; left: 9px; top: 8px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: white; font: 600 12px var(--f-body); }
.student-steps li.demo-current { border-color: var(--amber); background: #FFF4E5; box-shadow: none; }
.procedure-actions { display: flex; flex-wrap: wrap; gap: 7px; }
.procedure-actions .demo { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.demo-status { padding: 8px 10px; border-radius: 8px; background: #FFF4E5; color: #6B3A00; font-size: 13px; }
.steps .demo-current { background: #FFF4E5; box-shadow: 0 0 0 4px #FFF4E5; color: #4F3008; }
.procedure-actions button:disabled { opacity: .48; cursor: default; }
.stage.demo canvas { pointer-events: none; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }
.read { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.read div { background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; }
.read span { font-size: 11.5px; color: var(--muted); } .read strong { font: 500 18px var(--f-mono); }
.live-read { position: absolute; left: 10px; bottom: 10px; z-index: 3; display: flex; gap: 5px; pointer-events: none; }
.live-read div { min-width: 88px; padding: 5px 8px; background: rgba(250,251,250,.9); border: 1px solid rgba(195,206,201,.9); box-shadow: 0 2px 8px rgba(30,50,45,.12); backdrop-filter: blur(5px); }
.live-read span { font-size: 10px; } .live-read strong { font-size: 14px; }
.nb { list-style: none; margin: 0; padding: 0; font-size: 13.5px; display: grid; gap: 3px; }
.nb li { display: flex; gap: 8px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.nb .t { font: 11.5px var(--f-mono); color: var(--muted); flex: none; width: 36px; }
.nb .h { font: 12.5px var(--f-mono); color: var(--muted); flex: none; }
.logtools { display: flex; align-items: center; gap: 8px; }
.logtools .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.logtext { margin: 0; padding: 12px; min-height: 220px; max-height: 48vh; overflow: auto; white-space: pre-wrap; user-select: text; -webkit-user-select: text; border: 1px solid var(--line); border-radius: 10px; background: #F4F7F6; color: var(--ink); font: 12.5px/1.55 var(--f-mono); }
.cap { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.err { color: var(--err); }
.how summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.how ul { margin-top: 6px; }
.note .nact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; } .note .nact button { white-space: nowrap; } .note .nact button { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 6px 10px; font: 600 13px var(--f-body); cursor: pointer; }

.ans { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.ans .arow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px; align-items: center; font-size: 14px; }
.ans select, .ans input { font: 14px var(--f-body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
.ans .btn { justify-self: start; }
.activity { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.activity-row { display: grid; gap: 5px; }
.activity-row .btn { justify-self: stretch; text-align: left; background: var(--surface); }
.activity-row .btn:disabled { opacity: 1; border-color: var(--ok); color: var(--ok); cursor: default; }
.activity-result { padding: 7px 9px; border-left: 3px solid var(--accent); background: var(--surface); color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.manual { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; font-size: 13.5px; line-height: 1.45; }
.manual .mh { display: flex; justify-content: space-between; align-items: center; gap: 8px; } .manual .mh b { font: 600 15px var(--f-display); }
.manual .mh button { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); }
.manual .ms span { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.manual .ms p { margin: 0 0 3px; }
.manual.over { position: absolute; right: 8px; top: 56px; width: min(46%, 230px); max-height: calc(100% - 70px); overflow-y: auto; z-index: 6; font-size: 12.5px; padding: 10px 11px; box-shadow: 0 6px 20px rgba(30,50,45,.16); }
.side { position: fixed; z-index: 14; right: 12px; top: 96px; width: min(315px, calc(100vw - 24px)); max-height: calc(100svh - 112px); overflow-y: auto; border-radius: 12px; box-shadow: 0 12px 40px rgba(30,50,45,.24); transform: translateX(calc(100% + 28px)); transition: transform .22s ease; background: var(--surface); }
.side.open { transform: translateX(0); }
.side .card { min-height: 0; padding: 46px 13px 14px; gap: 9px; }
.side .card h1 { font-size: 15px; }
.side .student-steps li { font-size: 13px; padding-top: 7px; padding-bottom: 7px; }
.inspector-close { position: absolute; z-index: 2; right: 10px; top: 9px; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); font: 500 22px/1 var(--f-body); cursor: pointer; }
@media (max-width: 700px) {
  .side { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: min(72svh, 620px); transform: translateY(calc(100% + 20px)); border-radius: 16px 16px 10px 10px; }
  .side.open { transform: translateY(0); }
  .live-read { right: 8px; left: 8px; overflow-x: auto; } .live-read div { min-width: 82px; flex: 1; }
}
@media (max-width: 700px) { .labgrid { grid-template-columns: 1fr; } .labcard { min-height: 0; } .filterrow > span { width: 100%; } }
</style>
<header class="top">
  <div><b id="ttl">Chemistry Bench 3D</b><small id="sub"></small></div>
  <span class="sp"></span>
  <button class="btn" id="inspectorToggle" type="button"></button>
  <button class="btn" id="reset"></button>
  <select id="lang" aria-label="Language / Keel / Мова / Язык"><option value="et">Eesti</option><option value="uk">Українська</option><option value="ru">Русский</option><option value="en">English</option></select>
</header>
<main class="wrap">
  <div class="col"><div class="tools" id="tools"><div class="viewbar" id="viewbar"></div></div><div class="inv" id="inv" hidden></div><div class="invmsg" id="invmsg" hidden></div><div class="places" id="places"></div><div class="stage" id="stage"><div class="loading" id="loading">Loading 3D bench…</div><div class="tip" id="tip" hidden></div><div class="read live-read" id="liveRead"><div><span id="rpl"></span><strong id="rp">–</strong></div><div><span id="rtl"></span><strong id="rt">–</strong></div><div><span id="rbl"></span><strong id="rb">–</strong></div></div></div><p class="hint" id="hint"></p></div>
  <div class="side" id="inspector" aria-hidden="true"><button class="inspector-close" id="inspectorClose" type="button" aria-label="Close">×</button><aside class="card" id="card"></aside></div>
  <div class="picker" id="picker" hidden></div>
</main>
