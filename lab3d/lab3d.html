<style>

  "sc.ind1.steps": "Put on safety goggles (tap them on the hook).|Pick up bottle A, hold it over an empty test tube and let it tilt until about 1 mL is in. Do the same for B and C.|Add drops of an indicator with its dropper and note the colour. Try at least two different indicators.|Choose your conclusion for every bottle and check your answer.",
  "sc.neu1.steps": "Put on goggles.|Add a few drops of phenolphthalein to the acid with the dropper.|Pour NaOH: a stream at first, then let it drip near the end point.|Stop at the first pale pink colour that does not fade. If you overshoot, add a drop of acid back.|Put the spirit lamp under the beaker to evaporate the water, then name the salt.",
  "sc.neu2.steps": "Put on goggles.|Hold the pipette over a flask to deliver 10.00 mL of acid X, then add an indicator with the dropper.|Drag the burette tap to the right to open it: a stream at first, then single drops. Close it at the end point and read the burette.|To repeat, refill the burette by pouring NaOH into its top and use the second flask.|Calculate c(HCl) = c(NaOH) × V(NaOH) / V(HCl) and check.",
  "sc.neu3.steps": "Put on goggles.|Deliver 10.00 mL of Y into the flask with the pipette and put the pH electrode into it.|Open the burette tap a little at a time. Use single drops near the steep part of the curve.|The equivalence point is the middle of the jump. At half the equivalence volume, pH = pKₐ.|Decide which indicator changes colour at the equivalence point, then check your results.",
  "sc.org1.steps": "Put on goggles.|Take the cap off the spirit lamp and light it with a match. For the gas burner, open the gas tap and light it.|Hold the cold, dry glass over the flame. Touch the droplets with cobalt chloride paper.|Hold the funnel over the flame so the gases bubble through the limewater.|Slide the burner’s air collar closed and hold the porcelain dish in the flame.|Put the cap back on the lamp and close the gas tap, then answer the questions.",
  "sc.org2.steps": "Put on goggles.|Drop boiling chips into the flask, put a safe heat source under it and set the thermometer bulb level with the side arm.|Connect the water hose to the lower condenser inlet and open the tap. Tap the heat source to switch it on.|Watch the thermometer. Put a new receiver under the outlet when the temperature rises above about 90 °C.|Dip the alcoholometer into each receiver, test it with a lit match, and choose your best fraction.",
  "sc.org3.steps": "Connect the gas hose to the oxygen cylinder or to the air pump.|Put the two absorption tubes into the train in the correct order.|Put on goggles. Weigh each tube on the balance, press the furnace switch, then weigh the tubes again.|n(C) = n(CO₂); n(H) = 2·n(H₂O); m(O) = m(sample) − m(C) − m(H).|Find the empirical formula, then the molecular formula using M, and check.",

  'sc.ind1.title': 'Acid, alkali or water?', 'sc.ind1.short': 'Identify three unlabelled bottles with indicators.',
  'sc.ind1.goal': 'Bottles A, B and C contain hydrochloric acid, sodium hydroxide solution and distilled water, but the labels are missing. Use indicators to find out which bottle is acidic, which is alkaline and which is neutral.',

  'sc.ind1.hint': 'Phenolphthalein turns crimson only in alkali. Methyl orange is red in acid. Litmus is red in acid, blue in alkali and purple in neutral solution.',
  'sc.ind2.title': 'Five unlabelled solutions', 'sc.ind2.short': 'Use pH and extra tests to tell salts, acids and alkalis apart.',
  'sc.ind2.goal': 'Bottles A–E contain 0.1 M HCl, NaOH, NaCl, Na₂CO₃ and NH₄Cl. Some salts also change the pH (hydrolysis). Estimate the pH of each solution and use extra tests where needed to identify every bottle.',
  'sc.ind2.steps': 'Put on goggles.|Test a sample of each bottle with pH paper or universal indicator and compare with the colour chart.|Two bottles are alkaline. Add hydrochloric acid to a sample of each: a carbonate fizzes.|Two bottles are acidic. A strong acid has a much lower pH than a salt of a weak base.|Identify each bottle and check your answer.',
  'sc.ind2.hint': 'Approximate pH: HCl ≈ 1, NH₄Cl ≈ 5, NaCl ≈ 7, Na₂CO₃ ≈ 11.5, NaOH ≈ 13.',
  'sc.ind3.title': 'Strong and weak electrolytes', 'sc.ind3.short': 'Measure pH precisely and calculate pKₐ of acetic acid.',
  'sc.ind3.goal': 'Bottles A–F contain 0.1 M HCl, CH₃COOH, NaOH, NH₃ (aq), CH₃COONa and NH₄Cl. Measure the pH of each with a pH meter, identify the solutions, and calculate pKₐ of acetic acid from your measurement.',
  'sc.ind3.steps': 'Put on goggles.|Measure the pH of a sample from each bottle with the pH meter.|Pair them: strong acid and weak acid, strong base and weak base, and two salts that hydrolyse.|For a 0.1 M weak acid, Kₐ ≈ [H⁺]² / c and pKₐ = −log Kₐ.|Enter the identities and pKₐ, then check.',
  'sc.ind3.hint': '0.1 M HCl has pH 1.0 and 0.1 M CH₃COOH about 2.9. With [H⁺] = 10^−pH, Kₐ = [H⁺]² / 0.1.',
  'sc.neu1.title': 'Make table salt', 'sc.neu1.short': 'Neutralise hydrochloric acid exactly and crystallise the salt.',
  'sc.neu1.goal': 'The beaker holds 10 mL of 0.1 M hydrochloric acid. Neutralise it exactly with 0.1 M sodium hydroxide, then evaporate the water to obtain crystals of the salt.',

  'sc.neu1.hint': '10 mL of 0.1 M HCl needs exactly 10 mL of 0.1 M NaOH. Add 9 mL, then single drops.',
  'sc.neu2.title': 'Titration of an unknown acid', 'sc.neu2.short': 'Find the concentration of HCl with a burette.',
  'sc.neu2.goal': 'Find the concentration of hydrochloric acid X by titrating it with 0.100 M NaOH from a burette.',

  'sc.neu2.hint': 'HCl + NaOH → NaCl + H₂O, ratio 1 : 1. Use the burette reading at the first permanent colour change.',
  'sc.neu3.title': 'Weak acid titration curve', 'sc.neu3.short': 'Record a pH curve, find concentration and pKₐ, choose an indicator.',
  'sc.neu3.goal': 'Acetic acid Y has an unknown concentration. Titrate it with 0.100 M NaOH, record the titration curve with a pH meter, choose a suitable indicator, and find the concentration and pKₐ.',

  'sc.neu3.hint': 'The salt CH₃COONa is basic, so the equivalence point is above pH 7. Methyl orange changes colour much too early.',
  'sc.pre1.title': 'Three precipitates', 'sc.pre1.short': 'Get Cu(OH)₂, AgCl and BaSO₄ by mixing solutions.',
  'sc.pre1.goal': 'Using the solutions on the shelf, obtain in separate test tubes: a blue precipitate of copper(II) hydroxide, a white precipitate of silver chloride and a white precipitate of barium sulfate.',
  'sc.pre1.steps': 'Put on goggles.|Decide which two solutions contain the ions needed for each precipitate.|Pour about 1 mL of each into a test tube and observe.|When all three precipitates are in the tubes, check your work.',
  'sc.pre1.hint': 'Cu(OH)₂ needs Cu²⁺ and OH⁻. AgCl needs Ag⁺ and Cl⁻. BaSO₄ needs Ba²⁺ and SO₄²⁻.',

  'sc.ind1.title': 'Кислота, щёлочь или вода?', 'sc.ind1.short': 'Определите три склянки без этикеток с помощью индикаторов.',
  'sc.ind1.goal': 'В склянках A, B и C находятся соляная кислота, раствор гидроксида натрия и дистиллированная вода, но этикетки потерялись. С помощью индикаторов выясните, где кислота, где щёлочь, а где нейтральный раствор.',

  'sc.ind1.hint': 'Фенолфталеин становится малиновым только в щёлочи. Метиловый оранжевый красный в кислоте. Лакмус красный в кислоте, синий в щёлочи и фиолетовый в нейтральной среде.',
  'sc.ind2.title': 'Пять растворов без этикеток', 'sc.ind2.short': 'По pH и дополнительным опытам различите соли, кислоты и щёлочи.',
  'sc.ind2.goal': 'В склянках A–E находятся 0,1 М HCl, NaOH, NaCl, Na₂CO₃ и NH₄Cl. Некоторые соли тоже меняют pH (гидролиз). Оцените pH каждого раствора и при необходимости проведите дополнительные опыты, чтобы определить все склянки.',
  'sc.ind2.steps': 'Наденьте очки.|Проверьте пробу из каждой склянки индикаторной бумагой или универсальным индикатором и сравните со шкалой.|Две склянки щелочные. Добавьте к пробе каждой соляную кислоту: карбонат вскипает.|Две склянки кислые. У сильной кислоты pH намного ниже, чем у соли слабого основания.|Определите каждую склянку и проверьте ответ.',
  'sc.ind2.hint': 'Примерный pH: HCl ≈ 1, NH₄Cl ≈ 5, NaCl ≈ 7, Na₂CO₃ ≈ 11,5, NaOH ≈ 13.',
  'sc.ind3.title': 'Сильные и слабые электролиты', 'sc.ind3.short': 'Точно измерьте pH и рассчитайте pKₐ уксусной кислоты.',
  'sc.ind3.goal': 'В склянках A–F находятся 0,1 М HCl, CH₃COOH, NaOH, NH₃ (водн.), CH₃COONa и NH₄Cl. Измерьте pH каждого раствора pH-метром, определите растворы и по своему измерению вычислите pKₐ уксусной кислоты.',
  'sc.ind3.steps': 'Наденьте очки.|Измерьте pH пробы из каждой склянки pH-метром.|Составьте пары: сильная и слабая кислота, сильное и слабое основание, две гидролизующиеся соли.|Для 0,1 М слабой кислоты Kₐ ≈ [H⁺]² / c, pKₐ = −lg Kₐ.|Введите вещества и pKₐ, затем проверьте.',
  'sc.ind3.hint': '0,1 М HCl имеет pH 1,0, а 0,1 М CH₃COOH — около 2,9. При [H⁺] = 10^−pH: Kₐ = [H⁺]² / 0,1.',
  'sc.neu1.title': 'Получаем поваренную соль', 'sc.neu1.short': 'Точно нейтрализуйте соляную кислоту и выделите соль.',
  'sc.neu1.goal': 'В стакане 10 мл 0,1 М соляной кислоты. Точно нейтрализуйте её 0,1 М раствором гидроксида натрия, затем выпарите воду и получите кристаллы соли.',

  'sc.neu1.hint': 'На 10 мл 0,1 М HCl нужно ровно 10 мл 0,1 М NaOH. Добавьте 9 мл, затем по одной капле.',

  'sc.neu2.goal': 'Определите концентрацию соляной кислоты X титрованием 0,100 М раствором NaOH из бюретки.',

  'sc.neu3.title': 'Кривая титрования слабой кислоты', 'sc.neu3.short': 'Запишите кривую pH, найдите концентрацию и pKₐ, выберите индикатор.',
  'sc.neu3.goal': 'Концентрация уксусной кислоты Y неизвестна. Оттитруйте её 0,100 М NaOH, запишите кривую титрования pH-метром, выберите подходящий индикатор и найдите концентрацию и pKₐ.',

  'sc.neu3.hint': 'Соль CH₃COONa имеет щелочную среду, поэтому точка эквивалентности выше pH 7. Метиловый оранжевый меняет цвет слишком рано.',

ottle: it may contaminate the reagent.", "x.dirtyPipette": "A used pipette was dipped into the bottle of {b}. Use a clean pipette for each reagent, or rinse it first.", "x.pipSpill": "A pipette with {a} of liquid was laid on the bench and the liquid ran out.", "x.helpBtn": "What is this? Tap, then tap an object", "x.helpPick": "Tap anything on the bench", "x.close": "Close", "x.stOn": "It is on.", "x.stOff": "It is off.", "x.h.beaker.t": "Beaker {v} · 250 mL", "x.h.beaker.b": "Holds {ml} mL now. The scale on the side is only approximate (±5 %); for exact volumes use a pipette.|Drag it to move it, put it on the balance or pour from it into another beaker or the sink. Moving it gently swirls the contents.", "x.h.bottle.t": "{n} ({f})", "x.h.bottle.b": "Reagent bottle, about {ml} mL left. Corrosive: wear goggles and pour over the bench, never towards a person.|Bring it over a beaker and drag down to tilt and pour. For an exact volume draw it up with a clean pipette instead. Never pour anything back into the bottle.", "x.h.bottleW.t": "Water (H₂O)", "x.h.bottleW.b": "Bottle of water, about {ml} mL left. Use it to dilute solutions or to dissolve solids.|Bring it over a beaker and drag down to tilt and pour.", "x.h.dropper.t": "{n}", "x.h.dropper.b": "Dropper bottle of indicator. An indicator changes colour with pH, so a few drops show whether a solution is acidic, neutral or alkaline.|Hold the dropper over a beaker for a steady stream of drops, or let go of it there and tap the rubber bulb once for each drop. Each drop is 0.05 mL.", "x.h.wash.t": "Wash bottle (distilled water)", "x.h.wash.b": "Squeeze bottle of distilled water for rinsing glassware and electrodes.|Hold it over a beaker to squirt water in. To rinse: empty the beaker into the sink, squirt in some water, swirl, empty again.", "x.h.jar.t": "Sodium chloride, NaCl (s)", "x.h.jar.b": "Jar of solid sodium chloride (table salt), M = 58.44 g/mol.|Dip the spatula into the jar to load it. Salt left on the spatula is thrown away, never put back.", "x.h.spatula.t": "Spatula", "x.h.spatula.b": "Stainless steel spatula for solids; one load holds up to 1.6 g.|Dip it into the jar, then hold it over a beaker to let the crystals fall. Weigh the beaker before and after to know how much you added.", "x.h.balance.t": "Top-loading balance · 0.01 g", "x.h.balance.b": "{st} Reads to 0.01 g, up to 620 g.|Tap ON/OFF and wait for 0.00 g. Put a beaker on the pan and tap TARE to zero it, then add the substance: the display shows only what you added. A dot on the left means the reading is stable.", "x.h.meter.t": "pH meter", "x.h.meter.b": "{st} It measures pH with the electrode and shows the temperature too.|Tap the red ON/OFF key on its top, wait for the self-test, then dip the electrode into a beaker. Wait until the number stops changing. Rinse the electrode with distilled water between samples. The button pH meter at the top left gives a close view of the display.", "x.h.electrode.t": "pH electrode", "x.h.electrode.b": "Glass combination electrode connected to the pH meter. The thin glass bulb at the tip is fragile.|Drag it into a beaker so the bulb is under the liquid. Between uses keep it in the storage beaker.", "x.h.storage.t": "Electrode storage beaker", "x.h.storage.b": "Holds KCl storage solution that keeps the electrode bulb wet. Put the electrode back here when you finish.", "x.h.rod.t": "Glass rod", "x.h.rod.b": "For stirring. Drag it into a beaker and move it around to mix; let go and it leans against the wall. Rinse it before using it in another solution.", "x.h.rodholder.t": "Rod holder", "x.h.rodholder.b": "Small beaker where the glass rod stands when not in use. Let go of the rod near it to put it back.", "x.h.sink.t": "Sink", "x.h.sink.b": "Pour waste and rinse water here. Dilute acids and alkalis from this experiment may go down the sink with plenty of water.", "x.h.bench.t": "Lab bench", "x.h.bench.b": "Chemical-resistant worktop. Keep it dry and clear: wipe up spills at once and put equipment down where it cannot be knocked over.", "x.h.wall.t": "Tiled wall", "x.h.wall.b": "Drag empty space to rotate the view; use Move or two fingers to slide it sideways.", "x.h.p3.t": "Graduated transfer pipette · 3 mL", "x.h.p3.b": "Plastic pipette with a bulb, marked every 0.5 mL; read it to 0.1 mL. Holds {ml} now.|Carry it into a bottle or beaker and keep holding. Drag up to draw liquid in, drag down to let it out. Use a clean pipette for each reagent.", "x.h.p10.t": "Graduated pipette · 10 mL", "x.h.p10.b": "Glass measuring pipette with a pump, marked every 0.1 mL; read it to 0.05 mL. Use it when you need an exact volume. Holds {ml} now.|Carry it into a bottle or beaker and keep holding. Drag up to draw liquid in (the pump wheel turns), drag down to let it out. Read the volume at eye level on the note above the pipette."}, "ru": {"x.steps": "Добавьте в стакан A ровно 3 капли универсального индикатора.|Добавьте гидроксид натрия: наливайте медленно или отмеряйте точный объём пипеткой; перемешивайте палочкой. Остановитесь, когда раствор станет зелёным (pH ≈ 7).|Включите весы, поставьте пустой стакан B и нажмите TARE. Перелейте половину A в B и снимите показание.|Растворите шпатель хлорида натрия в воде в стакане C и взвесьте.|Вылейте стакан в раковину, дважды ополосните его из промывалки, включите pH-метр и проверьте промывную воду электродом.", "x.hint": "Перетаскивайте предметы, чтобы взять их; над стаканом тяните вниз, чтобы наклонить и налить. Тяните по пустому месту — вращение, правой кнопкой или двумя пальцами — сдвиг, двойное касание — приблизить. Нажмите ? и затем любой предмет, чтобы узнать, что это.", "x.how": "Налить: поднесите склянку или стакан к другому стакану — он наклонится почти до начала налива. Не отпуская, тяните вниз, чтобы наклонить сильнее, вверх — чтобы вернуть. Уровень жидкости остаётся горизонтальным, она льётся, только когда доходит до края; перевёрнутая горлышком вниз посуда опорожняется. Во время наливания вид приближается (Автозум), а наклон и налитый объём видны вверху; на сенсорном экране предмет держится чуть выше пальца.|Пипетки: внесите пипетку в склянку или стакан и не отпускайте. Тяните вверх, чтобы набрать жидкость, вниз — чтобы выпустить; подпись над пипеткой показывает объём. Перенесите её в другой стакан и тяните вниз, чтобы отдать жидкость. Отпущенная в стакане пипетка остаётся в нём.|Отпустите во время наливания или работы с пипеткой — склянка, стакан или пипетка останутся на месте. Затем тяните где угодно вверх или вниз, чтобы наклонить или набрать/выпустить; нажмите на пустое место, чтобы поставить склянку или стакан. Так вторая рука свободна.|Водопроводная вода: нажмите на синюю ручку крана, держите стакан под струёй, нажмите снова, чтобы закрыть.|Край экрана: поднесите предмет к краю вида — вид сдвинется.|Точные капли: отпустите пипетку-капельницу над стаканом — она останется в горлышке; нажимайте на резиновую грушу по одному разу на каплю.|pH-метр: нажмите красную клавишу ON/OFF на приборе, дождитесь самопроверки и опустите электрод в стакан.|Ополоснуть: вылейте стакан в раковину (около 0,4 мл всегда остаётся на стенках), налейте воды из промывалки, покачайте стакан, снова вылейте.|Взвесить: нажмите ON/OFF, поставьте стакан на чашку, нажмите TARE для обнуления и добавьте вещество.|Твёрдое вещество: опустите шпатель в банку, затем держите его над стаканом, чтобы кристаллы ссыпались.|Поставить: всё остаётся там, где вы отпустили.|Вид: тяните по пустому месту, чтобы вращать, или выберите «Сдвиг» и тяните, чтобы сдвинуть стол вбок (то же делают правая кнопка мыши, два пальца и стрелки). Колёсико, щипок или + и − приближают к указателю. Двойное касание — рассмотреть место вблизи; «pH-метр» показывает дисплей крупно.|Взболтать и перемешать: встряхните телефон или быстро подвигайте предмет из стороны в сторону (работает и с мышью, и на интерактивной доске). Наклон телефона вбок во время наливания наклоняет склянку сильнее, если телефон это позволяет.|Перейти: кнопки над столом переносят вид к рабочему месту, реактивам, весам, pH-метру или раковине; «Весь стол» возвращает исходный вид.|Шкаф и полка: кнопки над столом поворачивают вид к шкафу с посудой на левой стене или к полке реактивов на правой. Нажмите на предмет, чтобы поставить его на стол; нажмите на его жёлтую этикетку, чтобы убрать (посуда должна быть пустой).|Справка: нажмите ? над столом, затем любой предмет на столе.", "x.meterKey": "Клавиша ON/OFF pH-метра: нажмите, чтобы включить или выключить", "x.meterIsOn": "pH-метр включён.", "x.meterIsOff": "pH-метр выключен.", "x.p3": "Градуированная пипетка, 3 мл", "x.p10": "Градуированная пипетка 10 мл с дозатором", "x.pipHint": "внесите в склянку или стакан, тяните вверх — набрать, вниз — выпустить", "x.pipDrag": "вверх — набрать · вниз — выпустить", "x.backToBottle": "Жидкость вернули в склянку с реактивом. Никогда ничего не возвращайте в склянку: можно загрязнить реактив.", "x.dirtyPipette": "Использованную пипетку опустили в склянку «{b}». Берите для каждого реактива чистую пипетку или сначала ополосните её.", "x.pipSpill": "Пипетку с {a} жидкости положили на стол, и жидкость вытекла.", "x.helpBtn": "Что это? Нажмите, затем на предмет", "x.helpPick": "Нажмите на любой предмет на столе", "x.close": "Закрыть", "x.stOn": "Включён.", "x.stOff": "Выключен.", "x.h.beaker.t": "Стакан {v} · 250 мл", "x.h.beaker.b": "Сейчас в нём {ml} мл. Шкала на стенке приблизительная (±5 %); для точных объёмов используйте пипетку.|Перетащите, чтобы переставить, поставить на весы или перелить в другой стакан или раковину. При движении содержимое перемешивается.", "x.h.bottle.t": "{n} ({f})", "x.h.bottle.b": "Склянка с реактивом, осталось около {ml} мл. Едкое вещество: работайте в очках и наливайте над столом, не в сторону людей.|Поднесите к стакану и тяните вниз, чтобы наклонить и налить. Для точного объёма наберите его чистой пипеткой. Ничего не возвращайте в склянку.", "x.h.bottleW.t": "Вода (H₂O)", "x.h.bottleW.b": "Склянка с водой, осталось около {ml} мл. Для разбавления растворов и растворения веществ.|Поднесите к стакану и тяните вниз, чтобы наклонить и налить.", "x.h.dropper.t": "{n}", "x.h.dropper.b": "Капельница с индикатором. Индикатор меняет цвет в зависимости от pH: несколько капель показывают, кислый, нейтральный или щелочной раствор.|Держите пипетку над стаканом — капли пойдут одна за другой, или отпустите её там и нажимайте на грушу по разу на каплю. Одна капля — 0,05 мл.", "x.h.wash.t": "Промывалка (дистиллированная вода)", "x.h.wash.b": "Мягкая бутыль с дистиллированной водой для ополаскивания посуды и электродов.|Держите над стаканом, чтобы брызнуть воду. Ополаскивание: вылейте стакан в раковину, налейте немного воды, покачайте, снова вылейте.", "x.h.jar.t": "Хлорид натрия, NaCl (тв.)", "x.h.jar.b": "Банка с твёрдым хлоридом натрия (поваренной солью), M = 58,44 г/моль.|Опустите в банку шпатель, чтобы набрать соль. Остаток на шпателе выбрасывают, а не возвращают в банку.", "x.h.spatula.t": "Шпатель", "x.h.spatula.b": "Шпатель из нержавеющей стали для твёрдых веществ; за раз набирает до 1,6 г.|Опустите в банку, затем держите над стаканом, чтобы кристаллы ссыпались. Взвесьте стакан до и после, чтобы узнать массу добавленного.", "x.h.balance.t": "Технические весы · 0,01 г", "x.h.balance.b": "{st} Точность 0,01 г, предел 620 г.|Нажмите ON/OFF и дождитесь 0.00 g. Поставьте стакан на чашку и нажмите TARE, затем добавляйте вещество: на дисплее только добавленная масса. Точка слева — показание стабильно.", "x.h.meter.t": "pH-метр", "x.h.meter.b": "{st} Измеряет pH через электрод и показывает температуру.|Нажмите красную клавишу ON/OFF сверху, дождитесь самопроверки и опустите электрод в стакан. Дождитесь, пока число перестанет меняться. Между образцами ополаскивайте электрод дистиллированной водой. Кнопка «pH-метр» слева вверху показывает дисплей вблизи.", "x.h.electrode.t": "pH-электрод", "x.h.electrode.b": "Комбинированный стеклянный электрод, подключённый к pH-метру. Тонкий стеклянный шарик на конце хрупкий.|Перетащите в стакан, чтобы шарик был под жидкостью. Между измерениями держите его в стаканчике для хранения.", "x.h.storage.t": "Стаканчик для хранения электрода", "x.h.storage.b": "Раствор KCl не даёт шарику электрода высохнуть. Верните электрод сюда после работы.", "x.h.rod.t": "Стеклянная палочка", "x.h.rod.b": "Для перемешивания. Опустите в стакан и водите ею; отпущенная, она опирается о стенку. Ополосните перед использованием в другом растворе.", "x.h.rodholder.t": "Подставка для палочки", "x.h.rodholder.b": "Стаканчик, где стоит палочка, когда она не нужна. Отпустите палочку рядом, чтобы вернуть её.", "x.h.sink.t": "Раковина", "x.h.sink.b": "Сюда выливают отходы и промывную воду. Разбавленные кислоты и щёлочи из этого опыта можно сливать с большим количеством воды.", "x.h.bench.t": "Лабораторный стол", "x.h.bench.b": "Химически стойкая столешница. Держите её сухой и свободной: сразу вытирайте пролитое и ставьте посуду так, чтобы её нельзя было опрокинуть.", "x.h.wall.t": "Кафельная стена", "x.h.wall.b": "Тяните по пустому месту, чтобы вращать вид; «Сдвиг» или два пальца сдвигают его вбок.", "x.h.p3.t": "Градуированная пипетка · 3 мл", "x.h.p3.b": "Пластиковая пипетка с грушей, деления через 0,5 мл; отсчёт до 0,1 мл. Сейчас в ней {ml}.|Внесите в склянку или стакан и не отпускайте. Тяните вверх, чтобы набрать, вниз — чтобы выпустить. Для каждого реактива берите чистую пипетку.", "x.h.p10.t": "Градуированная пипетка · 10 мл", "x.h.p10.b": "Стеклянная мерная пипетка с дозатором, деления через 0,1 мл; отсчёт до 0,05 мл. Для точных объёмов. Сейчас в ней {ml}.|Внесите в склянку или стакан и не отпускайте. Тяните вверх, чтобы набрать (колёсико дозатора вращается), вниз — чтобы выпустить. Объём показан над пипеткой."}, "et": {"x.steps": "Lisa keeduklaasi A täpselt 3 tilka universaalindikaatorit.|Lisa naatriumhüdroksiidi: vala aeglaselt või mõõda täpne maht pipetiga ning sega klaaspulgaga. Lõpeta, kui lahus on roheline (pH ≈ 7).|Lülita kaal sisse, pane tühi keeduklaas B kaalule ja vajuta TARE. Vala pool A-st B-sse ja loe mass.|Lahusta spaatlitäis naatriumkloriidi vees keeduklaasis C ja kaalu see.|Tühjenda keeduklaas kraanikaussi, loputa seda kaks korda pesupudelist, lülita pH-meeter sisse ja kontrolli loputusvett elektroodiga.", "x.hint": "Lohista esemeid, et neid võtta; keeduklaasi kohal lohista alla, et kallutada ja valada. Tühjas kohas lohistamine pöörab, parem nupp või kaks sõrme nihutavad, topeltpuudutus toob lähemale. Puuduta ? ja siis mõnda eset, et teada saada, mis see on.", "x.how": "Vala: vii pudel või keeduklaas teise keeduklaasi kohale — see kaldub peaaegu valamiseni. Hoia edasi ja lohista alla, et kallutada rohkem, üles, et tagasi tõsta. Vedeliku pind jääb horisontaalseks ja see voolab alles siis, kui jõuab servani; ava allapoole pööratud anum tühjeneb. Valamise ajal tuleb vaade lähemale (Automaatsuum) ning kalle ja valatud kogus on näha üleval; puuteekraanil hõljub ese veidi sõrme kohal.|Pipetid: vii pipett reaktiivipudelisse või keeduklaasi ja hoia kinni. Lohista üles, et vedelikku sisse tõmmata, alla, et välja lasta; silt pipeti kohal näitab mahtu. Vii see teise keeduklaasi ja lohista alla, et vedelik välja lasta. Keeduklaasis lahti lastud pipett jääb sinna seisma.|Lase valamise või pipeteerimise ajal lahti — pudel, keeduklaas või pipett jääb paigale. Siis lohista kus tahes üles või alla, et kallutada või täita/tühjendada; puuduta tühja kohta, et pudel või keeduklaas tagasi panna. Nii jääb teine käsi vabaks.|Kraanivesi: puuduta kraani sinist käepidet, hoia keeduklaasi joa all, puuduta uuesti, et sulgeda.|Ekraani serv: vii ese vaate servale ja vaade liigub kaasa.|Täpsed tilgad: lase tilguti keeduklaasi kohal lahti — see jääb ava kohale; puuduta kummiballooni iga tilga jaoks üks kord.|pH-meeter: puuduta meetril punast ON/OFF klahvi, oota enesetesti lõppu ja kasta elektrood keeduklaasi.|Loputa: kalla keeduklaas kraanikaussi tühjaks (umbes 0,4 mL jääb alati seintele), pritsi pesupudelist vett sisse, loksuta keeduklaasi liigutades, kalla uuesti tühjaks.|Kaalu: puuduta ON/OFF, pane keeduklaas kaalutassile, puuduta TARE nullimiseks ja lisa aine.|Tahke aine: kasta spaatel purki, siis hoia seda keeduklaasi kohal, et kristallid kukuksid.|Maha panek: kõik jääb sinna, kus selle lahti lased.|Vaade: lohista tühjas kohas pööramiseks või vali „Nihuta“ ja lohista, et lauda külje suunas liigutada (sama teevad parem hiirenupp, kaks sõrme ja nooleklahvid). Keri, näpista või + ja − suumivad kursori suunas. Topeltpuudutus toob koha lähedale; „pH-meeter“ näitab ekraani lähedalt.|Loksuta ja sega: raputa telefoni või liiguta eset kiiresti küljelt küljele (töötab ka hiire ja interaktiivse tahvliga). Telefoni külgsuunas kallutamine valamise ajal kallutab pudelit rohkem, kui telefon seda võimaldab.|Mine: nupud laua kohal viivad vaate töökohale, reaktiividele, kaalule, pH-meetrile või kraanikausile; „Kogu laud“ toob tagasi algvaate.|Kapp ja riiul: nupud laua kohal pööravad vaate vasaku seina nõudekapile või parema seina kemikaaliriiulile. Puuduta eset, et see lauale panna; puuduta selle kollast silti, et tagasi panna (nõud peavad enne tühjad olema).|Abi: puuduta laua kohal ?, siis mõnda eset laual.", "x.meterKey": "pH-meetri ON/OFF klahv: puuduta sisse- või väljalülitamiseks", "x.meterIsOn": "pH-meeter lülitati sisse.", "x.meterIsOff": "pH-meeter lülitati välja.", "x.p3": "Gradueeritud pipett, 3 mL", "x.p10": "Gradueeritud pipett 10 mL pumbaga", "x.pipHint": "vii pudelisse või keeduklaasi, lohista üles täitmiseks, alla tühjendamiseks", "x.pipDrag": "üles — täida · alla — tühjenda", "x.backToBottle": "Vedelik pandi tagasi reaktiivipudelisse. Ära pane kunagi midagi varupudelisse tagasi: see võib reaktiivi rikkuda.", "x.dirtyPipette": "Kasutatud pipett kasteti pudelisse „{b}“. Kasuta iga reaktiivi jaoks puhast pipetti või loputa seda enne.", "x.pipSpill": "Pipett {a} vedelikuga pandi lauale ja vedelik voolas välja.", "x.helpBtn": "Mis see on? Puuduta, siis eset", "x.helpPick": "Puuduta mõnda .man.rod.t": "Glass rod", "x.man.rod.app": "Drag it into a beaker and move it to stir. It stands in its holder, which you can move too.", "x.man.rod.real": "Stir gently without touching the walls; rinse before using it in another solution.", "x.man.spatula.t": "Spatula", "x.man.spatula.app": "Hold it over the salt jar to fill it, then over a beaker to tip the salt in.", "x.man.spatula.real": "Use a clean, dry spatula for each solid; never return excess to the stock jar.", "x.man.hood.t": "Fume cupboard", "x.man.hood.app": "Tap the switch for the fan and the glass front to raise or lower it. Move items in with 'Move to the fume cupboard' (tap an item).", "x.man.hood.real": "Switch on the fan before you start, work at least 15 cm inside, keep the sash low, never put your head inside.", "x.man.goggles.t": "Safety goggles", "x.man.goggles.app": "The Goggles button puts them on; the view gets a blue frame. Labs log a mistake if you work without them.", "x.man.goggles.real": "Wear them from the first bottle to the last rinse, also over glasses.", "x.man.gloves.t": "Protective gloves", "x.man.gloves.app": "The Gloves button puts them on; a glove icon appears.", "x.man.gloves.real": "Nitrile gloves for acids, alkalis and toxic salts. Take them off before touching your phone, door handles or your face; never near a flame with loose gloves."}, "ru": {"x.nacl": "Хлорид натрия 0,1 М", "x.na2so4": "Сульфат натрия 0,1 М", "x.cuso4": "Сульфат меди(II) 0,1 М", "x.agno3": "Нитрат серебра 0,1 М", "x.bacl2": "Хлорид бария 0,1 М", "x.unknown": "Неизвестный раствор", "x.labStart": "Работа начата. Сначала наденьте очки; склянки и реактивы на столе.", "x.lab.ind1": "Наденьте очки (кнопка над столом).|Налейте немного из склянки A в чистый стакан; так же с B и C.|Добавьте в каждый стакан 2–3 капли индикатора и сравните цвета.|Выберите ниже для каждой склянки: кислота, щёлочь или нейтральный раствор, и нажмите «Проверить».", "x.lab.ind2": "Наденьте очки и перчатки.|Налейте немного из каждой ": "нейтральный (вода)", "x.ansPka": "pKₐ уксусной кислоты", "x.ansCheck": "Проверить", "x.ansWrong": "Пока нет: неверных ответов — {n}. Проверьте ещё раз и исправьте.", "x.ansPkaOff": "Вещества определены верно, но pKₐ неточен. Измерьте pH слабой кислоты ещё раз.", "x.bottleL": "Склянка {l}", "x.open": "Открыть", "x.toHood": "Перенести в вытяжной шкаф", "x.toBench": "Перенести на стол", "x.movedHood": "{n}: перенесено в вытяжной шкаф.", "x.movedBench": "{n}: перенесено на стол.", "x.propOpen": "Открыто. Перенесите к стакану и потяните вниз, чтобы наклонить и налить.", "x.propClosed": "Закрыто. Откройте, чтобы налить.", "x.propInert": "В этой версии при выливании ведёт себя как вода.", "x.propEmptyNow": "Пусто.", "x.rxCO2": "{n} вскипает в кислоте в стакане {v}: углекислый газ.", "x.dissolves": "{n} растворяется в стакане {v}.", "x.lampLitMove": "Сначала наденьте колпачок на спиртовку.", "x.lampLitBack": "Сначала погасите пламя колпачком.", "x.goggles": "Очки", "x.gogglesT": "Надеть или снять защитные очки", "x.gloves": "Перчатки", "x.glovesT": "Надеть или снять защитные перчатки", "x.gogglesOn": "Очки надеты.", "x.gogglesOff": "Очки сняты.", "x.glovesOn": "Перчатки надеты.", "x.glovesOff": "Перчатки сняты.", "x.noGoggles": "Работа с реактивами без очков. Сначала наденьте их.", "x.noGloves": "Едкий раствор взят без перчаток.", "x.noGogglesFlame": "Огонь зажжён без очков.", "x.lightIt": "Зажечь спичкой", "x.needMatches": "Рядом со спиртовкой нужны спички: возьмите коробок в шкафу с посудой (полка на уровне глаз).", "x.lampLit": "Спиртовка горит: маленькое почти бесцветное пламя с синим ядром.", "x.fl.Li": "{n} окрашивает пламя в карминово-красный цвет.", "x.fl.Na": "{n} окрашивает пламя в ярко-жёлтый цвет.", "x.fl.K": "{n} окрашивает пламя в фиолетовый цвет.", "x.fl.Rb": "{n} окрашивает пламя в красно-фиолетовый цвет.", "x.fl.Cs": "{n} окрашивает пламя в сине-фиолетовый цвет.", "x.fl.Ca": "{n} окрашивает пламя в оранжево-красный цвет.", "x.fl.Sr": "{n} окрашивает пламя в малиновый цвет.", "x.fl.Ba": "{n} окрашивает пламя в жёлто-зелёный цвет.", "x.fl.Cu": "{n} окрашивает пламя в сине-зелёный цвет.", "x.fl.B": "{n} окрашивает пламя в ярко-зелёный цвет.", "x.fl.Mg": "{n} горит ослепительно белым светом и оставляет белый пепел (MgO). Не смотрите прямо на пламя.", "x.fl.S": "{n} плавится и горит маленьким синим пламенем; образуется удушливый сернистый газ.", "x.fl.P": "{n} горит ярким пламенем с густым белым дымом (P₄O₁₀).", "x.fl.C": "{n} раскаляется докрасна и медленно сгорает до углекислого газа.", "x.fl.Fe": "{n} разбрасывает яркие искры: раскалённое железо горит на воздухе.", "x.fl.Zn": "{n} горит голубовато-зелёным пламенем с белым дымом (ZnO).", "x.fl.col": "{n} окрашивает пламя.", "x.fl.none": "{n} в пламени спиртовки заметно не изменяется.", "x.needHood": "{n} при нагревании даёт ядовитые пары: работайте в вытяжном шкафу с включённым вентилятором.", "x.manApp": "В этой лаборатории", "x.manReal": "В настоящей лаборатории", "x.man.beaker.t": "Химический стакан", "x.man.beaker.app": "Перетаскивайте, чтобы передвинуть. Над другим стаканом или раковиной потяните вниз, чтобы наклонить и налить.", "x.man.beaker.real": "Не для точных объёмов (±5 %). Лейте через носик; не нагревайте закрытый или треснувший стакан.", "x.man.tubes.t": "Пробирки", "x.man.tubes.app": "Пока их можно переносить и ставить.", "x.man.tubes.real": "Наполняйте не больше чем на треть. Нагревайте в держателе, отверстием от людей.", "x.man.flask.t": "Колбы", "x.man.flask.app": "Пока их можно переносить и ставить.", "x.man.flask.real": "Коническая — для перемешивания и титрования; круглодонная — для нагревания и перегонки, всегда закреплённая; мерная — для точного объёма до метки.", "x.man.dish.t": "Чашки и тигли", "x.man.dish.app": "Пока их можно переносить и ставить.", "x.man.dish.real": "Выпаривайте в чашке на слабом огне; тигли нагревайте на фарфоровом треугольнике и переносите только щипцами.", "x.man.cylinder.t": "Мерный цилиндр", "x.man.cylinder.app": "Пока его можно переносить и ставить.", "x.man.cylinder.real": "Отсчёт по нижнему краю мениска на уровне глаз. Точность около ±1 %.", "x.man.pipette.t": "Пипетки", "x.man.pipette.app": "Опустите кончик в жидкость и потяните вверх, чтобы набрать; над стаканом потяните вниз, чтобы вылить. Лупа показывает шкалу.", "x.man.pipette.real": "Никогда не набирайте ртом: пользуйтесь грушей. Отсчёт на уровне глаз; не выдувайте остаток из мерной пипетки.", "x.man.burette.t": "Бюретка", "x.man.burette.app": "Пока её можно переносить и ставить; титрование появится позже.", "x.man.burette.real": "Ополосните титрантом, заполните выше нуля, удалите воздух из носика, отсчитывайте до 0,05 мл на уровне глаз.", "x.man.funnel.t": "Воронки и фильтрование", "x.man.funnel.app": "Пока их можно переносить и ставить.", "x.man.funnel.real": "Сложите фильтр конусом, смочите и лейте по стеклянной палочке. Делительная воронка: чаще выпускайте газ, открывайте пробку перед сливом.", "x.man.lamp.t": "Спиртовка", "x.man.lamp.app": "Нажмите на спиртовку: «Открыть» снимает колпачок, «Зажечь спичкой» зажигает её (рядом должны быть спички). «Закрыть» надевает колпачок — пламя гаснет.", "x.man.lamp.real": "Никогда не зажигайте от другой спиртовки и не задувайте — гасите колпачком. Заправляйте только холодную и погашенную, на две трети.", "x.man.bunsen.t": "Газовая горелка", "x.man.bunsen.app": "Пока её можно переносить и ставить.", "x.man.bunsen.real": "Закройте воздушное отверстие, зажгите спичку, затем откройте газ. Откройте воздух для горячего синего пламени; в паузах оставляйте жёлтое.", "x.man.heatstand.t": "Штативы и нагреватели", "x.man.heatstand.app": "Пока их можно переносить и ставить.", "x.man.heatstand.real": "Закрепляйте посуду за горлышко. Треножник с сеткой распределяет пламя под стаканом. Плитка долго остаётся горячей после выключения.", "x.man.tongs.t": "Щипцы и держатели", "x.man.tongs.app": "Пока их можно переносить и ставить.", "x.man.tongs.real": "Горячие тигли и чашки берите только щипцами; пробирку держите держателем у верхнего края.", "x.man.thermo.t": "Стеклянный термометр", "x.man.thermo.app": "Пока его можно переносить и ставить; измеряют цифровые термометры.", "x.man.thermo.real": "Шарик в жидкости, не касаясь стекла; отсчёт на уровне глаз. Никогда не перемешивайте им.", "x.man.digthermo.t": "Цифровой термометр", "x.man.digthermo.app": "Перетащите его в стакан: щуп погрузится, показание установится за несколько секунд.", "x.man.digthermo.real": "Ополаскивайте и вытирайте щуп между растворами; дождитесь устойчивого показания.", "x.man.distill.t": "Детали для перегонки", "x.man.distill.app": "Пока их можно переносить и ставить.", "x.man.distill.real": "Вода входит в холодильник снизу и выходит сверху. Никогда не нагревайте закрытую систему; добавьте кипелки.", "x.man.gas.t": "Приборы для газов", "x.man.gas.app": "Пока их можно переносить и ставить.", "x.man.gas.real": "Собирайте газы над водой или вытеснением воздуха; водород проверяйте горящей лучинкой, кислород — тлеющей.", "x.man.splints.t": "Лучинки", "x.man.splints.app": "Пока их можно переносить и ставить.", "x.man.splints.real": "Горящая лучинка «хлопает» в водороде; тлеющая вспыхивает в кислороде; углекислый газ её гасит.", "x.man.matches.t": "Спички", "x.man.matches.app": "Поставьте коробок рядом со спиртовкой, нажмите на спиртовку и выберите «Зажечь спичкой».", "x.man.matches.real": "Чиркайте от себя, держите коробок закрытым, использованные спички кладите в чашку — не в мусор, пока горячие.", "x.man.phpaper.t": "Индикаторная бумага", "x.man.phpaper.app": "Пока её можно переносить и ставить; пользуйтесь универсальным индикатором или pH-метром.", "x.man.phpaper.real": "Нанесите каплю стеклянной палочкой; сравните цвет со шкалой в первые секунды.", "x.man.spectro.t": "Спектрофотометр / колориметр", "x.man.spectro.app": "Пока его можно переносить и ставить; измерения появятся позже.", "x.man.spectro.real": "Обнулите по холостой кювете, держите кюветы за матовые стенки, протирайте прозрачные, выберите длину волны максимального поглощения.", "x.man.instrument.t": "Измерительный прибор", "x.man.instrument.app": "Пока его можно переносить и ставить.", "x.man.instrument.real": "Калибруйте перед работой и ополаскивайте датчики дистиллированной водой.", "x.man.other.t": "Лабораторное оборудование", "x.man.other.app": "Перетаскивайте, чтобы передвинуть; нажмите для информации или чтобы вернуть на место.", "x.man.other.real": "Используйте каждый предмет по назначению и возвращайте чистым.", "x.man.element.t": "Банка с элементом", "x.man.element.app": "Нажмите на банку, чтобы снять крышку; перенесите к стакану и потяните вниз, чтобы высыпать. Поднесите открытую банку к горящей спиртовке, чтобы сжечь немного или увидеть окраску пламени.", "x.man.element.real": "Щелочные металлы режут мелко под маслом и берут пинцетом; ядовитые и радиоактивные элементы в школе не выдают.", "x.man.chemical.t": "Склянка или банка с реактивом", "x.man.chemical.app": "Нажмите, чтобы открыть; перенесите к стакану и потяните вниз, чтобы наклонить и налить. Закройте после работы.", "x.man.chemical.real": "Читайте этикетку дважды, держите склянку этикеткой вверх, кладите пробку на стол перевёрнутой, никогда не возвращайте реактив в склянку.", "x.man.dropper.t": "Капельница", "x.man.dropper.app": "Перенесите пипетку к стакану; нажмите на грушу, чтобы выпустить каплю.", "x.man.dropper.real": "Держите кончик над жидкостью, чтобы не загрязнить пипетку.", "x.man.rod.t": "Стеклянная палочка", "x.man.rod.app": "Перетащите её в стакан и двигайте, чтобы перемешать. Она стоит в подставке, которую тоже можно передвинуть.", "x.man.rod.real": "Перемешивайте осторожно, не касаясь стенок; ополосните перед другим раствором.", "x.man.spatula.t": "Шпатель", "x.man.spatula.app": "Подержите его над банкой с солью, чтобы набрать, затем над стаканом, чтобы высыпать.", "x.man.spatula.real": "Для каждого вещества — чистый сухой шпатель; излишки не возвращайте в банку.", "x.man.hood.t": "Вытяжной шкаф", "x.man.hood.app": "Нажмите на выключатель вентилятора и на стекло, чтобы поднять или опустить его. Переносите предметы кнопкой «Перенести в вытяжной шкаф» (нажмите на предмет).", "x.man.hood.real": "Включите вентилятор до начала работы, работайте не ближе 15 см от края, держите стекло низко, не засовывайте голову внутрь.", "x.man.goggles.t": "Защитные очки", "x.man.goggles.app": "Кнопка «Очки» надевает их; вид получает синюю рамку. В работах без очков записывается ошибка.", "x.man.goggles.real": "Носите от первой склянки до последнего ополаскивания, в том числе поверх своих очков.", "x.man.gloves.t": "Защитные перчатки", "x.man.gloves.app": "Кнопка «Перчатки» надевает их; появляется значок перчатки.", "x.man.gloves.real": "Нитриловые перчатки для кислот, щелочей и ядовитых солей. Снимайте их, прежде чем трогать телефон, ручки дверей или лицо; не подходите в них близко к огню."}, "et": {"x.nacl": "Naatriumkloriid 0,1 M", "x.na2so4": "Naatriumsulfaat 0,1 M", "x.cuso4": "Vask(II)sulfaat 0,1 M", "x.agno3": "Hõbenitraat 0,1 M", "x.bacl2": "Baariumkloriid 0,1 M", "x.unknown": "Tundmatu lahus", "x.labStart": "Töö algas. Pane kõigepealt prillid ette; pudelid ja reaktiivid on laual.", "x.lab.ind1": "Pane prillid ette (nupp laua kohal).|Vala veidi pudelist A puhtasse keeduklaasi; samamoodi B ja C.|Lisa igasse keeduklaasi 2–3 tilka indikaatorit ja võrdle värve.|Vali iga pudeli jaoks: hape, leelis või neutraalne, ja vajuta „Kontrolli“.", "x.lab.ind2": "Pane prillid ja kindad ette.|Vala igast pudelist veidi puhtasse keeduklaasi ja kontrolli universaalindikaatori või pH-meetriga.|Kaks pudelit on aluselised: lisa kummalegi vesinikkloriidhapet; karbonaat kihiseb.|Kaks pudelit on happelised: tugeva happe pH on palju madalam kui ammooniumisoola oma.|Vali iga pudeli valem ja vajuta „Kontrolli“.", "x.lab.ind3": "Pane prillid ja kindad ette.|Mõõda iga pudeli proovi pH pH-meetriga (loputa elektroodi proovide vahel).|Moodusta paarid: tugev ja nõrk hape, tugev ja nõrk alus, kaks hüdrolüüsuvat soo
